<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Resmi Supplier / Vendor - ITK Procurement</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0f2847; --navy-mid: #1a3a63;
      --accent: #3b82f6; --success: #10b981;
      --surface: #ffffff; --bg: #f0f4f8;
      --border: #e2e8f0; --text: #1e293b; --muted: #64748b;
      --radius: 12px; --radius-sm: 8px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    nav {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      padding: 0 2rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 16px rgba(15,40,71,0.18);
    }
    .nav-brand { display: flex; align-items: center; gap: 12px; }
    .nav-logo { width: 36px; height: 36px; background: rgba(255,255,255,0.12); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .nav-title { font-size: 15px; font-weight: 600; color: #fff; }
    .nav-sub { font-size: 12px; color: rgba(255,255,255,0.5); }
    .btn-logout { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }

    .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; }
    
    .tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px; margin-bottom: 1.5rem; width: fit-content; }
    .tab { padding: 10px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); border: none; background: none; }
    .tab.active { background: var(--navy); color: #fff; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
    .card-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); background: #fafbfa; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--navy); }
    .card-body { padding: 1.5rem; }

    .item-box { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1.25rem; margin-bottom: 1rem; background: #fff; }
    .item-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .item-name { font-size: 16px; font-weight: 600; color: var(--navy); }
    .item-meta { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
    
    .btn { border: none; border-radius: 6px; padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 14px; }
    
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .field input { width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 14px; outline: none; }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="nav-logo">🤝</div>
    <div>
      <div class="nav-title">Sistem Pengadaan ITK</div>
      <div class="nav-sub">Modul Terintegrasi Hulu ke Hilir &mdash; Portal Resmi Supplier / Vendor</div>
    </div>
  </div>
  <button class="btn-logout" onclick="window.location.href='index.html'">Keluar</button>
</nav>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('po-aktif', this)">1. PO Aktif (Kirim Barang & SJ)</button>
    <button class="tab" onclick="switchTab('barang-diterima', this)">2. Barang Diterima (Kirim Tagihan/Invoice)</button>
  </div>

  <div class="tab-panel active" id="tab-po-aktif">
    <div class="card">
      <div class="card-header"><div class="card-title">Pesanan Aktif (PO Terbit) &mdash; Siap Kirim</div></div>
      <div class="card-body" id="listPOAktif"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-barang-diterima">
    <div class="card">
      <div class="card-header"><div class="card-title">Barang Lolos Cek Gudang &mdash; Menunggu Dokumen Invoice Finansial</div></div>
      <div class="card-body" id="listBarangDiterima"></div>
    </div>
  </div>
</div>

<script>
  const SB_URL = "https://bgtgeltkbanlnvymalum.supabase.co";
  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE";
  const sb = supabase.createClient(SB_URL, SB_KEY);

  function switchTab(id, el) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + id).classList.add('active');
    el.classList.add('active');
  }

  async function muatDataSupplier() {
    // Ambil data tanpa filter rumit agar data tidak tersesat
    const { data: prs } = await sb.from('purchase_request').select('*').order('created_at', { ascending: false });
    
    const panelPO = document.getElementById('listPOAktif');
    const panelInvoice = document.getElementById('listBarangDiterima');

    // 1. FILTER PO AKTIF (Status disetujui / dalam pengiriman awal)
    const poAktif = prs ? prs.filter(p => p.status === 'disetujui') : [];
    if (poAktif.length === 0) {
      panelPO.innerHTML = `<div class="empty-state">Belum ada PO resmi baru yang diterbitkan.</div>`;
    } else {
      panelPO.innerHTML = poAktif.map(pr => `
        <div class="item-box">
          <div class="item-row">
            <div>
              <div class="item-name">${pr.nama_barang}</div>
              <div class="item-meta">Volume pesanan: <b>${pr.jumlah} Unit</b><br>Status: <span style="color:#3b82f6; font-weight:600;">PO Aktif</span></div>
            </div>
            <button class="btn btn-accent" onclick="prosesKirimBarang('${pr.id}')">🚚 Kirim Barang & Buat SJ</button>
          </div>
        </div>`).join('');
    }

    // 2. FILTER BARANG DITERIMA (PENYELAMAT: Tangkap status 'dikirim', 'barang_diterima', mau pun status antara)
    const siapInvoice = prs ? prs.filter(p => ['barang_diterima', 'dikirim'].includes(p.status)) : [];
    if (siapInvoice.length === 0) {
      panelInvoice.innerHTML = `<div class="empty-state">Belum ada barang masuk gudang yang siap dicairkan tagihannya.</div>`;
    } else {
      panelInvoice.innerHTML = siapInvoice.map(pr => `
        <div class="item-box" style="border-left: 4px solid var(--success);">
          <div class="item-row">
            <div style="flex: 1;">
              <div class="item-name">${pr.nama_barang}</div>
              <div class="item-meta">
                Volume: <b>${pr.jumlah} Unit</b><br>
                Status Logistik: <span style="color:var(--success); font-weight:700;">✓ Lolos Validasi Gudang</span>
              </div>
              <div style="margin-top: 12px; display: flex; gap: 8px; max-width: 400px;">
                <input type="text" id="inv_${pr.id}" placeholder="Contoh: INV/VND/${Math.floor(1000+Math.random()*9000)}" style="padding:6px; font-size:12px; border:1px solid #ccc; border-radius:4px; flex:1; outline:none;">
                <button class="btn btn-success" onclick="kirimTagihanInvoice('${pr.id}')">💰 Kirim Invoice</button>
              </div>
            </div>
          </div>
        </div>`).join('');
    }
  }

  async function prosesKirimBarang(prId) {
    // Ubah status ke dikirim
    await sb.from('purchase_request').update({ status: 'dikirim' }).eq('id', prId);
    alert("Sukses! Status diperbarui: Barang dalam perjalanan kurir vendor.");
    await muatDataSupplier();
  }

  async function kirimTagihanInvoice(prId) {
    const noInv = document.getElementById('inv_' + prId).value.trim();
    if(!noInv) { alert("Masukkan nomor invoice penagihan dahulu!"); return; }

    // Ambil info harga estimasi
    const { data: pr } = await sb.from('purchase_request').select('*').eq('id', prId).single();
    const nominal = pr.harga_estimasi ? pr.harga_estimasi : 1000000;

    // Masukkan data tagihan langsung bypass ke tabel keuangan menggunakan .upsert()
    await sb.from('invoices').upsert({
      pr_id: prId,
      no_invoice: noInv,
      nominal_tagihan: nominal,
      status: 'menunggu'
    }, { onConflict: 'pr_id' });

    // Naikkan status master ke invoice_dikirim
    await sb.from('purchase_request').update({ status: 'invoice_dikirim' }).eq('id', prId);
    
    alert("Sukses! Dokumen Invoice Terkirim ke Tim Keuangan.");
    await muatDataSupplier();
  }

  window.onload = muatDataSupplier;
</script>
</body>
</html>
