<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Mitra Vendor — Eksternal Supplier ITK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    }
    .custom-shadow {
      box-shadow: 0 4px 20px -2px rgba(15, 40, 71, 0.05), 0 2px 8px -1px rgba(15, 40, 71, 0.03);
    }
  </style>
</head>
<body class="text-slate-800 pb-24 min-h-screen">

  <header class="bg-[#2e1065] text-white px-10 h-[80px] flex items-center justify-between shadow-md border-b border-purple-500/20 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <div class="bg-purple-500 w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-md font-bold">🏢</div>
      <div>
        <h1 class="text-lg font-extrabold tracking-tight block leading-tight">ITK Vendor Connect</h1>
        <p class="text-[11px] text-purple-300 font-medium tracking-wide">Portal Resmi Kemitraan Eksternal Supplier &amp; Billing</p>
      </div>
    </div>
    <div class="flex items-center gap-6">
      <div class="text-right">
        <span class="text-xs font-bold bg-purple-400/20 text-purple-200 px-3 py-1 rounded-full border border-purple-500/30">Hak Akses: Eksternal Vendor</span>
      </div>
      <button onclick="location.href='index.html'" class="bg-white/5 hover:bg-red-500 border border-white/10 hover:border-red-500 px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 shadow-sm">Keluar Portal</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-8 mt-10">
    
    <div class="bg-white/80 backdrop-blur-md p-3 rounded-2xl border border-slate-200/60 shadow-sm mb-8">
      <div class="flex flex-wrap gap-1.5">
        <button onclick="setTabSupplier('kontrak_aktif')" id="v-tab-aktif" class="px-5 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2">
          📦 Kontrak &amp; PO Berjalan 
          <span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded-md text-[10px] font-black" id="v-badge-aktif">0</span>
        </button>
        <button onclick="setTabSupplier('riwayat_lunas')" id="v-tab-lunas" class="px-5 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2">
          ✅ Riwayat Transaksi Selesai (Lunas)
          <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md text-[10px] font-black" id="v-badge-lunas">0</span>
        </button>
      </div>
    </div>

    <div id="formKirimEksternal" class="bg-white border-2 border-purple-300 p-6 rounded-2xl mb-8 shadow-lg hidden bg-gradient-to-r from-purple-50/30 to-transparent">
      <div class="text-xs font-bold uppercase text-purple-800 tracking-wider mb-4 flex items-center gap-1.5">📝 PENERBITAN SURAT JALAN &amp; INVOICE PENAGIHAN VENDOR</div>
      <div id="kontenFormEksternal"></div>
    </div>

    <div class="space-y-4">
      <div class="flex items-center justify-between px-2">
        <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Daftar Purchase Order Berdasarkan Penawaran Awal</h3>
      </div>
      <div class="flex flex-col gap-4" id="containerOrderVendor"></div>
    </div>

  </main>

  <script>
    // INISIALISASI UTAMA CLIENT SUPABASE RESMI LU
    const { createClient } = supabase;
    const sb = createClient(
      'https://bgtgeltkbanlnvymalum.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE'
    );

    let currentTab = 'kontrak_aktif';

    function sinkronisasiHargaBackup(namaBarang) {
      const nama = namaBarang.toLowerCase();
      if(nama.includes('oli')) return 450000;
      if(nama.includes('busi')) return 120000;
      if(nama.includes('pipa')) return 850000;
      return 250000;
    }

    async function AmbilDataEksternal() {
      try {
        // Ambil data resmi dari client Supabase lu
        const { data, error } = await sb.from('purchase_request').select('*').order('created_at', { ascending: false });
        
        if (error) throw error;

        // Memilah kategori tab berdasarkan status database
        const kontrakAktif = data.filter(i => i.status !== 'lunas').length;
        const kontrakLunas = data.filter(i => i.status === 'lunas').length;

        document.getElementById('v-badge-aktif').innerText = kontrakAktif;
        document.getElementById('v-badge-lunas').innerText = kontrakLunas;

        TampilkanKartuVendor(data);
      } catch (e) { console.error("Eror Load Data: ", e); }
    }

    function setTabSupplier(tabBaru) {
      currentTab = tabBaru;
      document.getElementById('v-tab-aktif').className = "px-5 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100 transition-all duration-200";
      document.getElementById('v-tab-lunas').className = "px-5 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100 transition-all duration-200";
      
      if(currentTab === 'kontrak_aktif') {
        document.getElementById('v-tab-aktif').className = "px-5 py-2.5 rounded-xl text-xs font-bold bg-[#2e1065] text-white shadow-sm flex items-center gap-2";
      } else {
        document.getElementById('v-tab-lunas').className = "px-5 py-2.5 rounded-xl text-xs font-bold bg-[#2e1065] text-white shadow-sm flex items-center gap-2";
      }
      AmbilDataEksternal();
    }

    function TampilkanKartuVendor(allData) {
      const container = document.getElementById('containerOrderVendor');
      container.innerHTML = "";

      const filtered = allData.filter(item => {
        return currentTab === 'kontrak_aktif' ? item.status !== 'lunas' : item.status === 'lunas';
      });

      if(filtered.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-400 text-xs shadow-sm">✨ Tidak ada lembar PO vendor pada kategori ini.</div>`;
        return;
      }

      filtered.forEach(item => {
        const itemFix = item.nama_barang || 'Material Logistik';
        const vendorFix = item.supplier_terpilih || item.supplier || "PT. Mitra Rekanan ITK";
        
        let hargaFix = Number(item.harga_vendor) || Number(item.harga) || Number(item.harga_supplier) || 0;
        if(hargaFix <= 0) hargaFix = sinkronisasiHargaBackup(itemFix) * (item.jumlah || 1);

        // Membongkar data nomor SJ dan invoice dari database
        let nomorSJSaved = null;
        let nomorInvSaved = "INV-OFFICIAL/ITK";
        
        if (item.catatan_penerimaan && item.catatan_penerimaan.includes("SJ:")) {
          const part = item.catatan_penerimaan.split(" | ");
          nomorSJSaved = part[0].replace("[VENDOR] SJ: ", "");
          if(part[1]) nomorInvSaved = part[1].replace("INV: ", "");
        }

        let borderWarna = "border-l-purple-500";
        let labelStatus = "PO ... Siapkan Pengiriman";
        let statusBadge = "bg-purple-50 text-purple-700 border-purple-200";
        
        let tombolKontrol = `<button onclick="prosesPengirimanForm('${item.id}', '${itemFix}', ${hargaFix}, '${vendorFix}')" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-sm">🚀 Input SJ &amp; Tagih Invoice</button>`;

        // Deteksi status sinkronisasi perpindahan halaman audit
        if(item.status === 'dikirim' || nomorSJSaved || item.status === 'diterima' || item.status === 'selesai') {
          borderWarna = "border-l-pink-500";
          labelStatus = "SJ &amp; Invoice Terkirim (Proses Audit Kampus)";
          statusBadge = "bg-pink-50 text-pink-700 border-pink-200";
          tombolKontrol = `<span class="text-pink-700 font-bold text-xs bg-pink-50 border border-pink-200 px-4 py-2 rounded-xl">⏳ Menunggu Audit Internal</span>`;
          if(!nomorSJSaved) nomorSJSaved = "SJ/PRO-ITK/2026";
        }

        if(item.status === 'lunas') {
          borderWarna = "border-l-emerald-500";
          labelStatus = "Tagihan Lunas / PAID";
          statusBadge = "bg-emerald-50 text-emerald-700 border-emerald-200";
          tombolKontrol = `<span class="text-emerald-700 font-extrabold text-xs bg-emerald-50 border border-emerald-200 px-4 py-2 rounded-xl">💵 INVOICE PAID (CAIR)</span>`;
        }

        const shortId = item.id ? String(item.id).substring(0,6) : '0000';

        container.innerHTML += `
          <div class="bg-white border border-slate-200 rounded-2xl custom-shadow flex flex-col md:flex-row md:items-center justify-between gap-6 transition-all duration-300 relative overflow-hidden p-6 pl-8 border-l-4 ${borderWarna}">
            <div class="flex-1">
              <div class="flex items-center gap-3 mb-2">
                <h4 class="text-base font-extrabold text-slate-800 capitalize tracking-tight">${itemFix}</h4>
                <span class="text-[10px] font-bold uppercase border rounded-md px-2 py-0.5 ${statusBadge}">${labelStatus}</span>
              </div>
              <div class="grid grid-cols-2 md:grid-cols-4 gap-y-2 gap-x-4 text-xs font-medium text-slate-500">
                <div>Volume: <span class="text-slate-800 font-bold">${item.jumlah || 1} Pcs</span></div>
                <div>Nama Vendor: <span class="text-purple-700 font-extrabold">${vendorFix}</span></div>
                <div>Nilai Invoice Terkunci: <span class="text-emerald-600 font-black text-sm">Rp ${hargaFix.toLocaleString('id-ID')}</span></div>
                <div class="text-[10px] font-mono text-slate-400">PO-REF: #ITK-PO-${shortId}</div>
              </div>
              ${nomorSJSaved ? `
              <div class="mt-3 pt-3 border-t border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-2 text-[11px] font-semibold text-slate-600">
                <div>📄 <b>No. Surat Jalan:</b> <span class="text-purple-700 font-mono">${nomorSJSaved}</span></div>
                <div>💳 <b>No. Invoice Resmi:</b> <span class="text-emerald-700 font-mono">${nomorInvSaved}</span></div>
              </div>` : ''}
            </div>
            <div class="flex items-center gap-2 justify-end">${tombolKontrol}</div>
          </div>`;
      });
    }

    function prosesPengirimanForm(id, namaBarang, hargaKunci, vendorKunci) {
      const box = document.getElementById('formKirimEksternal');
      box.classList.remove('hidden');
      document.getElementById('kontenFormEksternal').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
          <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Input Nomor Surat Jalan (SJ)</label>
            <input type="text" id="sj_no_input" placeholder="Contoh: SJ/DENSO/VI/0029" class="h-11 px-4 border rounded-xl text-xs font-semibold outline-none focus:border-purple-600 w-full bg-white shadow-inner">
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Input Nomor Invoice Penagihan</label>
            <input type="text" id="inv_no_input" placeholder="Contoh: INV/DENSO-ITK/9982" class="h-11 px-4 border rounded-xl text-xs font-semibold outline-none focus:border-purple-600 w-full bg-white shadow-inner">
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Nilai Tagihan Pajak Kontrak (Deal Awal)</label>
            <div class="h-11 px-4 border border-purple-200 rounded-xl text-xs font-black bg-purple-50/50 flex items-center text-purple-900">
              Rp ${hargaKunci.toLocaleString('id-ID')}
            </div>
          </div>
          <div class="flex gap-2 md:col-span-3 justify-end mt-2">
            <button onclick="document.getElementById('formKirimEksternal').classList.add('hidden')" class="bg-slate-100 text-slate-600 text-xs font-bold h-11 px-5 rounded-xl">Batal</button>
            <button onclick="simpanDokumenVendorKeSistem('${id}', ${hargaKunci}, '${vendorKunci}')" class="bg-purple-700 text-white text-xs font-bold h-11 px-6 rounded-xl shadow-md">✓ Submit SJ &amp; Tagih Invoice</button>
          </div>
        </div>`;
    }

    async function simpanDokumenVendorKeSistem(id, hargaKunci, vendorKunci) {
      const sjInput = document.getElementById('sj_no_input').value.trim();
      const invInput = document.getElementById('inv_no_input').value.trim();
      
      if(!sjInput || !invInput) { 
        alert("Nomor Surat Jalan (SJ) dan Nomor Invoice Penagihan wajib diisi!"); 
        return; 
      }

      try {
        // PERBAIKAN MUTLAK: Update data menggunakan SDK Supabase bawaan lu agar lolos CORS!
        const { data, error } = await sb
          .from('purchase_request')
          .update({
            status: 'dikirim', // Mengubah status menjadi dikirim agar counter Staf Pengadaan naik
            catatan_penerimaan: `[VENDOR] SJ: ${sjInput} | INV: ${invInput}`,
            harga_vendor: hargaKunci,
            supplier_terpilih: vendorKunci
          })
          .eq('id', id);

        if (error) throw error;

        document.getElementById('formKirimEksternal').classList.add('hidden');
        setTabSupplier('kontrak_aktif');
        alert("Sukses! Surat Jalan & Invoice masuk database. Silakan cek menu 5 Audit SJ Staf Pengadaan.");
      } catch(e) { 
        console.error("Gagal update data: ", e);
        alert("Gagal mengirim dokumen: " + e.message);
      }
    }

    window.onload = () => setTabSupplier('kontrak_aktif');
  </script>
</body>
</html>
