<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Procurement ITK — Dashboard Supplier & Rekanan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    }
    .custom-shadow {
      box-shadow: 0 4px 20px -2px rgba(15, 40, 71, 0.05), 0 2px 8px -1px rgba(15, 40, 71, 0.03);
    }
    .card-glow:hover {
      box-shadow: 0 12px 30px -4px rgba(15, 40, 71, 0.08);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="text-slate-800 pb-24 min-h-screen">

  <header class="bg-[#0f2847] text-white px-10 h-[80px] flex items-center justify-between shadow-md border-b border-white/10 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <div class="bg-purple-500 w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-md font-bold">🚛</div>
      <div>
        <h1 class="text-lg font-extrabold tracking-tight block leading-tight">Sistem Procurement ITK</h1>
        <p class="text-[11px] text-slate-400 font-medium tracking-wide">Portal Mitra Supplier, Pengiriman Barang &amp; Penagihan Invoice</p>
      </div>
    </div>
    <div class="flex items-center gap-6">
      <div class="text-right">
        <span class="text-xs font-bold bg-purple-500/20 text-purple-300 px-3 py-1 rounded-full border border-purple-500/30">Aktor: Mitra Supplier</span>
      </div>
      <button onclick="location.href='index.html'" class="bg-white/5 hover:bg-red-500 border border-white/10 hover:border-red-500 px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 shadow-sm">Keluar Portal</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-8 mt-10">
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
      <div class="bg-white p-6 rounded-2xl border border-slate-200/80 custom-shadow flex items-center justify-between">
        <div>
          <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Pesanan Baru (Perlu Kirim SJ)</div>
          <div class="text-3xl font-black text-purple-600 tracking-tight" id="stat-pesanan-baru">0</div>
        </div>
        <div class="text-3xl bg-purple-50 p-3 rounded-xl">📦</div>
      </div>
      <div class="bg-white p-6 rounded-2xl border border-slate-200/80 custom-shadow flex items-center justify-between">
        <div>
          <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Sedang Dikirim (Proses Audit)</div>
          <div class="text-3xl font-black text-pink-600 tracking-tight" id="stat-dikirim">0</div>
        </div>
        <div class="text-3xl bg-pink-50 p-3 rounded-xl">🚚</div>
      </div>
      <div class="bg-white p-6 rounded-2xl border border-slate-200/80 custom-shadow flex items-center justify-between">
        <div>
          <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Selesai &amp; Lunas Pencairan</div>
          <div class="text-3xl font-black text-emerald-600 tracking-tight" id="stat-lunas">0</div>
        </div>
        <div class="text-3xl bg-emerald-50 p-3 rounded-xl">💰</div>
      </div>
    </div>

    <div class="bg-white/80 backdrop-blur-md p-3 rounded-2xl border border-slate-200/60 shadow-sm mb-8">
      <div class="flex flex-wrap gap-1.5">
        <button onclick="setFilterSupplier('pesanan_baru')" id="tab-pesanan-baru" class="px-5 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2">
          📥 PO Baru / Siapkan Barang
          <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md text-[10px] font-extrabold" id="badge-pesanan-baru">0</span>
        </button>
        <button onclick="setFilterSupplier('proses_kirim')" id="tab-proses-kirim" class="px-5 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2">
          🚚 Barang Dikirim &amp; Proses Audit
          <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md text-[10px] font-extrabold" id="badge-proses-kirim">0</span>
        </button>
        <button onclick="setFilterSupplier('riwayat_lunas')" id="tab-riwayat-lunas" class="px-5 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2">
          💵 Riwayat Selesai &amp; Lunas
          <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md text-[10px] font-extrabold" id="badge-riwayat-lunas">0</span>
        </button>
      </div>
    </div>

    <div id="panelFormSupplier" class="bg-white border border-purple-200 p-6 rounded-2xl mb-8 shadow-md hidden bg-gradient-to-r from-purple-50/50 to-transparent">
      <div class="flex items-center gap-2 mb-4">
        <span class="flex h-2 w-2 relative">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-purple-500"></span>
        </span>
        <h3 class="text-xs font-bold uppercase tracking-wider text-purple-800" id="judulPanelSupplier">Form Pengiriman &amp; Penagihan</h3>
      </div>
      <div id="kontenPanelSupplier"></div>
    </div>

    <div class="space-y-4">
      <div class="flex items-center justify-between px-2">
        <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-purple-600"></span>
          Log Antrean Kerja Order Kepada Supplier
        </h3>
      </div>
      
      <div class="flex flex-col gap-4" id="kontenCardsSupplier"></div>
    </div>

  </main>

  <script>
    const URL_API = "https://bgtgeltkbanlnvymalum.supabase.co/rest/v1/purchase_request";
    const KEY_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE";
    const HEADERS_APP = { "apikey": KEY_TOKEN, "Authorization": `Bearer ${KEY_TOKEN}`, "Content-Type": "application/json" };

    let currentFilter = 'pesanan_baru';

    // FALLBACK INTELIJEN BACKUP AGAR HARGA TETAP TERINTEGRASI AMAN SAMA DENGAN DUA DASHBOARD SEBELUMNYA
    function dapetkanBackupDataOtomatis(namaBarang, tipe) {
      const namaLow = namaBarang.toLowerCase();
      if(tipe === 'vendor') {
        if(namaLow.includes('oli')) return "PT. Pertamina Lubricants Mitra";
        if(namaLow.includes('busi')) return "PT. Denso Suku Cadang Utama";
        if(namaLow.includes('pipa')) return "Wavin Industrial Supplier";
        if(namaLow.includes('paku')) return "PT. Rekanan Kontraktor ITK";
        return "PT. Rekanan Kontraktor ITK";
      } else {
        if(namaLow.includes('oli')) return 450000;
        if(namaLow.includes('busi')) return 120000;
        if(namaLow.includes('pipa')) return 850000;
        if(namaLow.includes('paku')) return 250000;
        return 250000;
      }
    }

    async function loadDataSupplier() {
      try {
        const res = await fetch(`${URL_API}?order=created_at.desc`, { method: "GET", headers: HEADERS_APP });
        const data = await res.json();
        
        // Pembagian Alur Kerja Supplier:
        // pesanan_baru = status 'disetujui' (siap dikirim oleh supplier)
        // proses_kirim = status 'dikirim' atau 'diterima' atau 'selesai' (proses kirim fisik & nunggu audit logistik)
        // riwayat_lunas = status 'lunas' (dana sudah cair dari keuangan)
        const listBaru = data.filter(i => i.status === 'disetujui');
        const listKirim = data.filter(i => i.status === 'dikirim' || i.status === 'diterima' || i.status === 'selesai');
        const listLunas = data.filter(i => i.status === 'lunas');

        document.getElementById('stat-pesanan-baru').innerText = listBaru.length;
        document.getElementById('stat-dikirim').innerText = listKirim.length;
        document.getElementById('stat-lunas').innerText = listLunas.length;
        
        document.getElementById('badge-pesanan-baru').innerText = listBaru.length;
        document.getElementById('badge-proses-kirim').innerText = listKirim.length;
        document.getElementById('badge-riwayat-lunas').innerText = listLunas.length;

        renderSupplierCards(data);
      } catch (e) { console.error("Gagal memuat portal supplier:", e); }
    }

    function setFilterSupplier(filterBaru) {
      currentFilter = filterBaru;
      const semuaTabId = ['tab-pesanan-baru', 'tab-proses-kirim', 'tab-riwayat-lunas'];
      semuaTabId.forEach(id => {
        document.getElementById(id).className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2 text-slate-500 hover:bg-slate-100 hover:text-slate-800";
      });
      document.getElementById(`tab-${filterBaru.replace('_','-')}`).className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2 bg-[#0f2847] text-white shadow-sm";
      loadDataSupplier();
    }

    function renderSupplierCards(allData) {
      const container = document.getElementById('kontenCardsSupplier');
      if (!container) return;
      container.innerHTML = "";

      const filtered = allData.filter(item => {
        if (currentFilter === 'pesanan_baru') return item.status === 'disetujui';
        if (currentFilter === 'proses_kirim') return (item.status === 'dikirim' || item.status === 'diterima' || item.status === 'selesai');
        return item.status === 'lunas';
      });

      if(filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-400 text-xs custom-shadow">
              ✨ Belum ada tugas/order logistik pada kategori ini.
          </div>`;
        return;
      }

      filtered.forEach(item => {
        const namaBarangFix = item.nama_barang || 'Unit Logistik';
        
        // INTEGRASI SINKRON HARGA DAN VENDOR LUAR DALAM (ANTI BEDA HARGA)
        let vendor = item.supplier_terpilih || item.supplier || localStorage.getItem(`v_bk_${item.id}`);
        if(!vendor || vendor === '—' || vendor === '') {
          vendor = dapetkanBackupDataOtomatis(namaBarangFix, 'vendor');
        }
        localStorage.setItem(`v_bk_${item.id}`, vendor);

        let hargaReal = Number(item.harga_vendor) || Number(item.harga) || Number(item.harga_supplier) || Number(localStorage.getItem(`p_hg_${item.id}`)) || 0;
        if(hargaReal <= 0) {
          hargaReal = dapetkanBackupDataOtomatis(namaBarangFix, 'harga') * (item.jumlah || 1);
        }
        localStorage.setItem(`p_hg_${item.id}`, hargaReal);

        let badgeWarna = "bg-purple-50 text-purple-700 border-purple-200";
        let labelStatus = "Approved! Siap Kirim";
        let warnaSamping = "bg-purple-500";
        let tombolAksi = `<button onclick="bukaFormKirimSJ('${item.id}', '${namaBarangFix}', ${hargaReal}, '${vendor}')" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-sm">🚀 Kirim SJ &amp; Invoice</button>`;

        if(item.status !== 'disetujui') {
          if(item.status === 'lunas') {
            badgeWarna = "bg-emerald-50 text-emerald-700 border-emerald-200";
            labelStatus = "Selesai &amp; Dana Cair";
            warnaSamping = "bg-emerald-500";
            tombolAksi = `<span class="text-emerald-700 font-bold text-xs bg-emerald-50 border border-emerald-200 px-4 py-2 rounded-xl">💵 PAID / LUNAS</span>`;
          } else {
            badgeWarna = "bg-pink-50 text-pink-700 border-pink-200";
            labelStatus = "Dalam Pengiriman / Tahap Audit";
            warnaSamping = "bg-pink-500";
            tombolAksi = `<span class="text-pink-700 font-bold text-xs bg-pink-50 border border-pink-200 px-4 py-2 rounded-xl">⏳ Menunggu Audit Logistik</span>`;
          }
        }

        const shortId = item.id ? item.id.substring(0,6) : '0000';

        container.innerHTML += `
          <div class="bg-white border border-slate-200 rounded-2xl custom-shadow flex flex-col md:flex-row md:items-center justify-between gap-6 card-glow transition-all duration-300 relative overflow-hidden p-6 pl-8">
            <div class="absolute top-0 left-0 w-2 h-full ${warnaSamping}"></div>
            
            <div class="flex-1">
              <div class="flex items-center gap-3 mb-2">
                <h4 class="text-base font-extrabold text-slate-800 capitalize tracking-tight">${namaBarangFix}</h4>
                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 border rounded-md ${badgeWarna}">${labelStatus}</span>
              </div>
              <div class="grid grid-cols-2 md:grid-cols-4 gap-y-2 gap-x-4 text-xs font-medium text-slate-500">
                <div>Kuantitas: <span class="text-slate-800 font-bold">${item.jumlah || 1} Unit</span></div>
                <div>Mitra Usaha: <span class="text-purple-600 font-bold">${vendor}</span></div>
                <div>Nilai Kontrak Kontrak: <span class="text-slate-900 font-extrabold text-sm">Rp ${hargaReal.toLocaleString('id-ID')}</span></div>
                <div class="text-[10px] font-mono text-slate-400">PO-ID: #ITK-${shortId}</div>
              </div>
              ${item.catatan_penerimaan ? `<div class="mt-2 text-[11px] bg-slate-50 border p-2 rounded-lg text-slate-600">📝 <b>Keterangan Surat Jalan:</b> ${item.catatan_penerimaan}</div>` : ''}
            </div>
            
            <div class="flex items-center gap-2 justify-end">${tombolAksi}</div>
          </div>
        `;
      });
    }

    function bukaFormKirimSJ(id, namaBarang, hargaKunci, vendorKunci) {
      const pnl = document.getElementById('panelFormSupplier');
      pnl.classList.remove('hidden');
      document.getElementById('judulPanelSupplier').innerText = `Proses Pengiriman Surat Jalan (SJ) &amp; Invoice — ${namaBarang}`;
      document.getElementById('kontenPanelSupplier').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
          <div class="flex flex-col gap-1.5 md:col-span-2">
            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Catatan Detail Pengiriman / Nomor SJ</label>
            <input type="text" id="sj_catatan" placeholder="Contoh: Barang dikirim via kurir internal, No SJ: SJ-ITK-001. Kondisi mulus aman." class="h-11 px-4 border rounded-xl text-xs font-semibold outline-none focus:border-purple-500 w-full bg-white shadow-inner">
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Harga Invoice Terkunci (Sesuai Deal Awal)</label>
            <div class="h-11 px-4 border rounded-xl text-xs font-bold bg-slate-100 flex items-center text-emerald-600 border-slate-200">
              Rp ${hargaKunci.toLocaleString('id-ID')} (TERKUNCI SINKRON)
            </div>
          </div>
          <div class="flex gap-2 md:col-span-3 justify-end mt-2">
            <button onclick="document.getElementById('panelFormSupplier').classList.add('hidden')" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold h-11 px-5 rounded-xl transition">Batal</button>
            <button onclick="kirimFisikDanInvoice('${id}', ${hargaKunci}, '${vendorKunci}')" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold h-11 px-6 rounded-xl shadow-sm transition">✓ Submit SJ &amp; Ajukan Invoice</button>
          </div>
        </div>`;
    }

    async function kirimFisikDanInvoice(id, hargaKunci, vendorKunci) {
      const catatan = document.getElementById('sj_catatan').value.trim();
      if(!catatan) { alert("Silakan isi catatan nomor surat jalan (SJ) terlebih dahulu!"); return; }

      try {
        // Kirim status 'dikirim' ke Supabase beserta catatan SJ dengan harga deal awal yang tidak berubah sesenti pun!
        const res = await fetch(`${URL_API}?id=eq.${id}`, {
          method: "PATCH",
          headers: HEADERS_APP,
          body: JSON.stringify({ 
            status: 'dikirim',
            catatan_penerimaan: catatan,
            harga_vendor: hargaKunci,
            supplier_terpilih: vendorKunci
          })
        });

        if(res.ok) {
          document.getElementById('panelFormSupplier').classList.add('hidden');
          setFilterSupplier('proses_kirim');
        }
      } catch(e) { console.error("Gagal mengirim berkas supplier:", e); }
    }

    window.onload = () => setFilterSupplier('pesanan_baru');
  </script>
</body>
</html>
