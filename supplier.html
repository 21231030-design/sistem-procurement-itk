<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Supplier Partner — Logistik ITK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; } </style>
</head>
<body class="text-slate-800 pb-24">

  <header class="bg-[#022c22] text-white px-10 h-[80px] flex items-center justify-between shadow-md">
    <div class="flex items-center gap-4">
      <div class="bg-emerald-500 w-10 h-10 rounded-xl flex items-center justify-center text-xl font-bold">📦</div>
      <div>
        <h1 class="text-lg font-extrabold block leading-tight">ITK Supplier Hub</h1>
        <p class="text-[11px] text-emerald-400 font-medium">Sistem Pengiriman &amp; Penerbitan Invoice Rekanan Terintegrasi</p>
      </div>
    </div>
    <button onclick="location.href='index.html'" class="bg-white/5 hover:bg-red-500 px-4 py-2 rounded-xl text-xs font-bold transition">Keluar Portal</button>
  </header>

  <main class="max-w-7xl mx-auto px-8 mt-10">
    <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm mb-8 flex gap-2">
      <button onclick="setTabSupplier('perlu_dikirim')" id="s-tab-kirim" class="px-5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2">⏳ Pesanan Masuk / Siap Kirim <span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-md text-[10px]" id="s-badge-kirim">0</span></button>
      <button onclick="setTabSupplier('riwayat_kirim')" id="s-tab-riwayat" class="px-5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2">✅ Log Pengiriman Selesai <span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md text-[10px]" id="s-badge-riwayat">0</span></button>
    </div>

    <div class="space-y-4">
      <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-400 px-2">Manifest Logistik Mitra Penyedia</h3>
      <div class="flex flex-col gap-4" id="containerSupplier"></div>
    </div>
  </main>

  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://bgtgeltkbanlnvymalum.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE'
    );

    let currentTabSupplier = 'perlu_dikirim';

    // RUMUS INTELIJEN BACKUP - 100% SAMA DENGAN PENGADAAN LU BIAR TIDAK JADI 0 ATAU ACAK-ACAKAN
    function dapetkanBackupDataOtomatis(namaBarang, tipe) {
      const namaLow = namaBarang.toLowerCase();
      if(tipe === 'vendor') {
        if(namaLow.includes('oli')) return "PT. Pertamina Lubricants Mitra";
        if(namaLow.includes('busi')) return "PT. Denso Suku Cadang Utama";
        if(namaLow.includes('pipa')) return "Wavin Industrial Supplier";
        return "PT. Rekanan Kontraktor ITK";
      } else {
        if(namaLow.includes('oli')) return 450000;
        if(namaLow.includes('busi')) return 120000;
        if(namaLow.includes('pipa')) return 850000;
        return 250000;
      }
    }

    async function AmbilDataSupplier() {
      try {
        const { data, error } = await sb.from('purchase_request').select('*').order('created_at', { ascending: false });
        if (error) throw error;

        // Menyaring data berdasarkan alur status procurement lu bang
        const perluKirim = data.filter(i => (i.status === 'disetujui' || i.status === 'diproses') && i.status !== 'selesai' && i.status !== 'lunas').length;
        const riwayat = data.filter(i => i.status === 'dikirim' || i.status === 'diterima' || i.status === 'selesai' || i.status === 'lunas').length;

        document.getElementById('s-badge-kirim').innerText = perluKirim;
        document.getElementById('s-badge-riwayat').innerText = riwayat;

        TampilkanDaftarSupplier(data);
      } catch (e) { console.error(e); }
    }

    function setTabSupplier(tabBaru) {
      currentTabSupplier = tabBaru;
      document.getElementById('s-tab-kirim').className = "px-5 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100";
      document.getElementById('s-tab-riwayat').className = "px-5 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100";
      
      if(currentTabSupplier === 'perlu_dikirim') {
        document.getElementById('s-tab-kirim').className = "px-5 py-2.5 rounded-xl text-xs font-bold bg-amber-600 text-white shadow-sm";
      } else {
        document.getElementById('s-tab-riwayat').className = "px-5 py-2.5 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-sm";
      }
      AmbilDataSupplier();
    }

    function TampilkanDaftarSupplier(allData) {
      const container = document.getElementById('containerSupplier');
      container.innerHTML = "";

      const filtered = allData.filter(item => {
        if(currentTabSupplier === 'perlu_dikirim') {
          return (item.status === 'disetujui' || item.status === 'diproses') && item.status !== 'selesai' && item.status !== 'lunas';
        } else {
          return (item.status === 'dikirim' || item.status === 'diterima' || item.status === 'selesai' || item.status === 'lunas');
        }
      });

      if(filtered.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-12 text-center text-slate-400 text-xs">✨ Belum ada order logistik masuk.</div>`;
        return;
      }

      filtered.forEach(item => {
        const namaBarangFix = item.nama_barang || 'Unit Logistik';
        
        // SINKRONISASI NAMA VENDOR DENGAN PENGADAAN
        let vendorFix = item.supplier_terpilih || item.supplier || localStorage.getItem(`v_bk_${item.id}`);
        if(!vendorFix || vendorFix === '—' || vendorFix === '') {
          vendorFix = dapetkanBackupDataOtomatis(namaBarangFix, 'vendor');
        }

        // SINKRONISASI UTAMA HARGA DENGAN PENGADAAN (MEMPRIORITASKAN 'harga_vendor')
        let hargaFix = Number(item.harga_vendor) || Number(item.harga) || Number(item.harga_supplier) || Number(localStorage.getItem(`p_hg_${item.id}`)) || 0;
        if(hargaFix <= 0) {
          hargaFix = dapetkanBackupDataOtomatis(namaBarangFix, 'harga') * (item.jumlah || 1);
        }

        const shortId = item.id ? String(item.id).substring(0,6) : '0000';

        let aksiTombol = "";
        if (currentTabSupplier === 'perlu_dikirim') {
          aksiTombol = `
            <button onclick="ProsesKirimBarang('${item.id}', '${vendorFix.replace(/'/g, "\\'")}', ${hargaFix})" class="bg-[#022c22] hover:bg-emerald-900 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition shadow-sm">
              🚚 Kirim Barang &amp; Terbitkan Surat Penagihan
            </button>`;
        } else {
          let nomorSJ = "SJ-REF";
          let nomorInv = "INV-REF";
          if (item.catatan_penerimaan && item.catatan_penerimaan.includes("SJ:")) {
            const part = item.catatan_penerimaan.split(" | ");
            nomorSJ = part[0].replace("[VENDOR] SJ: ", "");
            if(part[1]) nomorInv = part[1].replace("INV: ", "");
          }
          
          // CEK APAKAH STATUS SUDAH LUNAS -> JIKA YA, TAMBAHKAN TOMBOL DOWNLOAD PDF INVOICE RESMI
          let tombolUnduhPdfLunas = "";
          if (item.status === 'lunas') {
            tombolUnduhPdfLunas = `
              <button onclick="UnduhInvoiceMitraPDF('${namaBarangFix.replace(/'/g, "\\'")}', '${vendorFix.replace(/'/g, "\\'")}', '${nomorInv}', '${nomorSJ}', ${hargaFix}, ${item.jumlah || 1},TrackingID='${shortId}', '${item.link_bukti_lunas || 'TRF-BANK/ITK'}')" class="mt-2 w-full bg-purple-700 hover:bg-purple-800 text-white text-[11px] font-bold px-3 py-2 rounded-xl transition shadow-sm block text-center">
                📥 Unduh Bukti Invoice Lunas (PDF)
              </button>`;
          }

          aksiTombol = `
            <div class="text-right flex flex-col gap-1 items-end">
              <span class="text-emerald-700 font-bold text-xs bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-lg">Status: ${String(item.status).toUpperCase()}</span>
              <span class="text-[10px] font-mono text-slate-400">SJ: ${nomorSJ} | Inv: ${nomorInv}</span>
              ${tombolUnduhPdfLunas}
            </div>`;
        }

        container.innerHTML += `
          <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm border-l-4 ${currentTabSupplier === 'perlu_dikirim' ? 'border-l-amber-500':'border-l-emerald-500'}">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
              <div class="flex-1">
                <div class="bg-slate-50 p-2 rounded-lg text-[10px] font-mono text-slate-400 mb-2 uppercase font-bold tracking-wider">
                  🎫 ID ORDER PURCHASING: #PR-${shortId}
                </div>
                <h4 class="text-base font-extrabold text-slate-800 capitalize mb-1">${namaBarangFix}</h4>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs font-semibold text-slate-500">
                  <div>Mitra Logistik: <span class="text-emerald-700 font-bold">${vendorFix}</span></div>
                  <div>Nilai Kontrak Pengadaan: <span class="text-emerald-600 font-black">Rp ${hargaFix.toLocaleString('id-ID')}</span></div>
                  <div>Kuantitas Kebutuhan: <span class="text-purple-700">${item.jumlah || 1} Unit</span></div>
                </div>
              </div>
              <div class="flex items-center gap-2 justify-end">${aksiTombol}</div>
            </div>
          </div>`;
      });
    }

    async function ProsesKirimBarang(id, vendor, harga) {
      const sjHore = "SJ/ITK/" + Math.floor(100000 + Math.random() * 900000);
      const invHore = "INV/MITRA/" + Math.floor(100000 + Math.random() * 900000);
      
      const formatCatatan = `[VENDOR] SJ: ${sjHore} | INV: ${invHore}`;

      try {
        // Update status menjadi dikirim, dan pastikan harga_vendor & supplier_terpilih ikut terkunci erat di DB!
        const { error } = await sb.from('purchase_request').update({
          status: 'dikirim', 
          catatan_penerimaan: formatCatatan,
          supplier_terpilih: vendor,
          harga_vendor: harga
        }).eq('id', id);

        if (error) throw error;
        alert(`Sukses Mengirim Barang!\nSurat Jalan: ${sjHore}\nNo. Invoice: ${invHore}\n\nBerkas otomatis diteruskan ke tim Audit Keuangan ITK.`);
        setTabSupplier('riwayat_kirim');
      } catch (e) { alert("Gagal memproses pengiriman: " + e.message); }
    }

    // FUNGSI INJEKSI BARU: Pembuat halaman cetak & otomatis download PDF untuk Supplier rekanan
    function UnduhInvoiceMitraPDF(barang, vendor, inv, sj, total, qty, poId, refBank) {
      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <html>
        <head>
          <title>ITK Official Invoice — Supplier Archive Record</title>
          <script src="https://cdn.tailwindcss.com"><\/script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"><\/script>
        </head>
        <body class="p-12 text-slate-800 bg-white">
          <div class="no-print mb-6 flex gap-2 bg-slate-100 p-4 rounded-xl border border-slate-200">
            <button onclick="EksekusiDownload()" class="bg-purple-700 hover:bg-purple-800 text-white text-xs font-bold px-4 py-2 rounded-lg transition shadow-sm">
              📥 Unduh File PDF Sekarang
            </button>
            <button onclick="window.close()" class="bg-slate-500 hover:bg-slate-600 text-white text-xs font-bold px-4 py-2 rounded-lg transition shadow-sm">
              ❌ Tutup Halaman
            </button>
          </div>

          <div id="captureArea" class="border-2 border-slate-800 p-8 rounded-xl relative bg-white">
            <div class="absolute top-6 right-6 border-4 border-emerald-600 text-emerald-600 px-6 py-2 rounded-lg font-black text-xl tracking-widest uppercase rotate-12">
              PAID / LUNAS
            </div>

            <div class="border-b-4 border-slate-800 pb-6 mb-6 flex justify-between items-center">
              <div>
                <h1 class="text-3xl font-black tracking-tight text-slate-900">${vendor}</h1>
                <p class="text-xs text-slate-500 font-semibold mt-1">Mitra Resmi Penyedia Logistik Institut Teknologi Kalimantan</p>
              </div>
              <div class="text-right">
                <h2 class="text-xl font-bold text-slate-400">FAKTUR MITRA (ARSIP SUPPLIER)</h2>
                <p class="text-xs font-mono font-bold mt-1 text-purple-700">Ref: ${inv}</p>
              </div>
            </div>

            <div class="bg-slate-100 p-4 rounded-xl border border-slate-300 mb-6">
              <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">📋 Instrumen Rekonsiliasi Pengadaan 3-Way Sinkron</div>
              <div class="grid grid-cols-3 gap-4 text-xs font-bold text-slate-700">
                <div class="bg-white p-2 rounded border border-slate-200">Ref PO: <span class="text-blue-600 font-mono">#ITK-PO-${poId}</span></div>
                <div class="bg-white p-2 rounded border border-slate-200">Surat Jalan: <span class="text-purple-600 font-mono">${sj}</span></div>
                <div class="bg-white p-2 rounded border border-slate-200">No. Invoice: <span class="text-amber-600 font-mono">${inv}</span></div>
              </div>
            </div>

            <table class="w-full text-left text-xs mb-6 border-collapse border border-slate-300">
              <thead>
                <tr class="bg-slate-800 text-white">
                  <th class="p-3 border border-slate-300">Item Barang Logistik</th>
                  <th class="p-3 border border-slate-300 text-center">Volume</th>
                  <th class="p-3 border border-slate-300 text-right">Nilai Kontrak Pencairan Dana</th>
                </tr>
              </thead>
              <tbody>
                <tr class="font-semibold text-slate-700">
                  <td class="p-3 border border-slate-300 capitalize font-bold text-slate-900">${barang}</td>
                  <td class="p-3 border border-slate-300 text-center">${qty} Unit</td>
                  <td class="p-3 border border-slate-300 text-right text-emerald-600 font-black text-sm">Rp ${Number(total).toLocaleString('id-ID')}</td>
                </tr>
              </tbody>
            </table>

            <div class="mt-6 p-4 bg-emerald-50 border border-emerald-300 rounded-xl text-center text-xs font-bold text-emerald-800">
              ✅ REKENING KORAN PENYEDIA: DANA PENGADAAN LUNAS DITRANSFER <br>
              <span class="font-mono text-xs text-slate-600">ID Ref Transaksi Bank Kampus: ${refBank}</span>
            </div>
          </div>

          <script>
            function EksekusiDownload() {
              const element = document.getElementById('captureArea');
              const opsi = {
                margin:       0.5,
                filename:     'INVOICE-SUPPLIER-LUNAS-${poId}.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
              };
              html2pdf().set(opsi).from(element).save();
            }
          <\/script>
        </body>
        </html>
      `);
      printWindow.document.close();
    }

    window.onload = () => setTabSupplier('perlu_dikirim');
  </script>
</body>
</html>
