<script>
    const URL_API = "https://bgtgeltkbanlnvymalum.supabase.co/rest/v1/purchase_request";
    const KEY_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE";
    const HEADERS_APP = { "apikey": KEY_TOKEN, "Authorization": `Bearer ${KEY_TOKEN}`, "Content-Type": "application/json" };

    let currentFilter = 'menunggu';

    async function loadDataSistem() {
      try {
        const res = await fetch(`${URL_API}?order=created_at.desc`, { method: "GET", headers: HEADERS_APP });
        const data = await res.json();
        
        // Sinkronisasi Counter Atas dengan Status User
        document.getElementById('stat-1').innerText = data.filter(i => i.status === 'menunggu' || !i.status).length;
        document.getElementById('stat-2').innerText = data.filter(i => i.status === 'diverifikasi').length;
        document.getElementById('stat-3').innerText = data.filter(i => i.status === 'diproses').length;
        document.getElementById('stat-4').innerText = data.filter(i => i.status === 'disetujui').length;
        document.getElementById('stat-5').innerText = data.filter(i => i.status === 'diterima' || i.status === 'dikirim').length;
        // Konter atas digabung agar mendeteksi semua yang sudah selesai/diterima
        document.getElementById('stat-6').innerText = data.filter(i => i.status === 'selesai' || i.status === 'diterima').length;

        // Badge menu tab
        document.getElementById('badge-menunggu').innerText = data.filter(i => i.status === 'menunggu' || !i.status).length;
        document.getElementById('badge-diverifikasi').innerText = data.filter(i => i.status === 'diverifikasi').length;
        document.getElementById('badge-diproses').innerText = data.filter(i => i.status === 'diproses').length;
        document.getElementById('badge-disetujui').innerText = data.filter(i => i.status === 'disetujui').length;
        document.getElementById('badge-diterima').innerText = data.filter(i => i.status === 'diterima').length;
        document.getElementById('badge-selesai').innerText = data.filter(i => i.status === 'selesai' || i.status === 'diterima').length;

        renderCards(data);
      } catch (e) { console.error(e); }
    }

    function setFilter(statusFilter) {
      currentFilter = statusFilter;
      
      ['tab-menunggu', 'tab-diverifikasi', 'tab-diproses', 'tab-disetujui', 'tab-diterima', 'tab-selesai'].forEach(id => {
        document.getElementById(id).className = "px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2 text-slate-500 hover:bg-slate-100 hover:text-slate-800";
      });
      
      document.getElementById(`tab-${statusFilter}`).className = "px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2 bg-[#0f2847] text-white shadow-sm";

      loadDataSistem();
    }

    function renderCards(allData) {
      const container = document.getElementById('kontenCardsPR');
      container.innerHTML = "";

      const filtered = allData.filter(item => {
        if (!item.status && currentFilter === 'menunggu') return true;
        // JIKA MEMBUKA TAB SELESAI, TAMPILKAN DATA YANG BERSTATUS 'selesai' ATAU 'diterima'
        if (currentFilter === 'selesai') return item.status === 'selesai' || item.status === 'diterima';
        return item.status === currentFilter;
      });

      if(filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200/80 p-12 text-center text-slate-400 text-xs custom-shadow">
             ✨ Tidak ada antrean berkas pengadaan pada kategori tab ini.
          </div>`;
        return;
      }

      filtered.forEach(item => {
        const vendor = item.supplier_terpilih || '—';
        const hargaReal = Number(item.harga_vendor) || 0;
        
        let warnaSamping = "bg-amber-500";
        let labelStatus = "Perlu Dicek Staf";
        let badgeWarna = "bg-amber-50 text-amber-700 border-amber-200";
        
        if(item.status === 'diverifikasi') { warnaSamping = "bg-cyan-500"; labelStatus = "Pencarian Vendor"; badgeWarna = "bg-cyan-50 text-cyan-700 border-cyan-200"; }
        if(item.status === 'diproses') { warnaSamping = "bg-indigo-500"; labelStatus = "Menunggu Approval Manajer"; badgeWarna = "bg-indigo-50 text-indigo-700 border-indigo-200"; }
        if(item.status === 'disetujui') { warnaSamping = "bg-purple-500"; labelStatus = "Disetujui! Siap Kirim Supplier"; badgeWarna = "bg-purple-50 text-purple-700 border-purple-200"; }
        if(item.status === 'diterima') { warnaSamping = "bg-pink-500"; labelStatus = "Barang Sampai (Perlu Audit SJ)"; badgeWarna = "bg-pink-50 text-pink-700 border-pink-200"; }
        if(item.status === 'selesai') { warnaSamping = "bg-emerald-500"; labelStatus = "Lunas & Selesai"; badgeWarna = "bg-emerald-50 text-emerald-700 border-emerald-200"; }

        let aksiTombol = "";
        if(!item.status || item.status === 'menunggu') {
          aksiTombol = `<button onclick="prosesStatus('${item.id}', 'diverifikasi')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition shadow-sm">✓ Verifikasi PR</button>`;
        } else if(item.status === 'diverifikasi') {
          aksiTombol = `<button onclick="bukaFormKunci('${item.id}', '${item.nama_barang}')" class="bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition shadow-sm">📄 Hubungkan Vendor & Harga</button>`;
        } else if(item.status === 'diproses') {
          aksiTombol = `<span class="text-indigo-700 font-bold text-xs bg-indigo-50 border border-indigo-200 px-4 py-2 rounded-xl flex items-center gap-1.5">⏳ Menunggu Meja Manajer</span>`;
        } else if(item.status === 'disetujui') {
          aksiTombol = `<button onclick="prosesStatus('${item.id}', 'dikirim')" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition shadow-sm">🚀 Serahkan ke Supplier (Kirim Barang)</button>`;
        } else if(item.status === 'diterima') {
          aksiTombol = `<button onclick="prosesStatus('${item.id}', 'selesai')" class="bg-pink-600 hover:bg-pink-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition shadow-sm">🔍 Lolos Audit SJ & Selesai</button>`;
        } else {
          aksiTombol = `<span class="text-emerald-700 font-bold text-xs bg-emerald-50 border border-emerald-200 px-4 py-2 rounded-xl flex items-center gap-1.5">🔒 Arsip History Aman</span>`;
        }

        const catatanUser = item.catatan_penerimaan ? `<div class="mt-2 text-[11px] bg-slate-50 border p-2 rounded-lg text-slate-600">📝 <b>Catatan Penerimaan User:</b> ${item.catatan_penerimaan}</div>` : '';

        container.innerHTML += `
          <div class="bg-white border border-slate-200 rounded-2xl custom-shadow flex flex-col md:flex-row md:items-center justify-between gap-6 card-glow transition-all duration-300 relative overflow-hidden p-6 pl-8">
            <div class="absolute top-0 left-0 w-2 h-full ${warnaSamping}"></div>
            
            <div class="flex-1">
              <div class="flex items-center gap-3 mb-2">
                <h4 class="text-base font-extrabold text-slate-800 capitalize tracking-tight">${item.nama_barang || 'Item Kosong'}</h4>
                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 border rounded-md ${badgeWarna}">${labelStatus}</span>
              </div>
              <div class="grid grid-cols-2 md:grid-cols-4 gap-y-2 gap-x-4 text-xs font-medium text-slate-500">
                <div>Kuantitas: <span class="text-slate-800 font-bold">${item.jumlah || 1} Unit</span></div>
                <div>Vendor: <span class="text-blue-600 font-bold">${vendor}</span></div>
                <div>Harga Deal: <span class="text-slate-900 font-extrabold">${hargaReal > 0 ? 'Rp ' + hargaReal.toLocaleString('id-ID') : '—'}</span></div>
                <div class="text-[10px] font-mono text-slate-400">ID: #PR-${item.id.substring(0,6)}</div>
              </div>
              ${catatanUser}
            </div>
            
            <div class="flex items-center gap-2 self-end md:self-auto border-t md:border-t-0 pt-3 md:pt-0 w-full md:w-auto justify-end">
              ${aksiTombol}
              <button onclick="hapusBaris('${item.id}')" class="bg-slate-50 hover:bg-red-50 text-slate-400 hover:text-red-500 text-xs font-bold px-4 py-2.5 rounded-xl border border-slate-200/60 hover:border-red-200 transition-all duration-200">Hapus</button>
            </div>
          </div>
        `;
      });
    }

    function bukaFormKunci(id, namaBarang) {
      const pnl = document.getElementById('panelFormSakti');
      pnl.classList.remove('hidden');
      document.getElementById('judulPanelSakti').innerText = `Langkah 2: Sinkronisasi Harga Rekanan — ${namaBarang}`;
      document.getElementById('kontenPanelSakti').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
          <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Nama Perusahaan Vendor</label>
            <input type="text" id="v_nama" placeholder="Contoh: PT. ITK Solusi Mandiri" class="h-11 px-4 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:border-blue-500 bg-white shadow-inner">
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Harga Penawaran Final (Satuan)</label>
            <input type="number" id="v_harga" placeholder="Rp 0" class="h-11 px-4 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:border-blue-500 bg-white shadow-inner">
          </div>
          <div class="flex gap-2">
            <button onclick="simpanKunciHarga('${id}')" class="bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-bold h-11 px-4 rounded-xl flex-1 shadow-sm transition">Kunci & Ajukan ke Manajer</button>
            <button onclick="document.getElementById('panelFormSakti').classList.add('hidden')" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold h-11 px-4 rounded-xl transition">Batal</button>
          </div>
        </div>
      `;
    }

    async function simpanKunciHarga(id) {
      const vendor = document.getElementById('v_nama').value.trim();
      const harga = parseFloat(document.getElementById('v_harga').value) || 0;
      if(!vendor || harga <= 0) { alert("Data vendor dan harga tidak valid!"); return; }

      try {
        const res = await fetch(`${URL_API}?id=eq.${id}`, {
          method: "PATCH",
          headers: HEADERS_APP,
          body: JSON.stringify({ supplier_terpilih: vendor, harga_vendor: harga, status: 'diproses' })
        });
        if(res.ok) {
          document.getElementById('panelFormSakti').classList.add('hidden');
          setFilter('diproses');
        }
      } catch(e) { console.error(e); }
    }

    async function prosesStatus(id, statusBaru) {
      try {
        const res = await fetch(`${URL_API}?id=eq.${id}`, {
          method: "PATCH",
          headers: HEADERS_APP,
          body: JSON.stringify({ status: statusBaru })
        });
        if(res.ok) {
          setFilter(statusBaru);
        }
      } catch(e) { console.error(e); }
    }

    async function hapusBaris(id) {
      if(!confirm("Apakah Anda yakin ingin menghapus bersih data ini?")) return;
      try {
        const res = await fetch(`${URL_API}?id=eq.${id}`, { method: "DELETE", headers: HEADERS_APP });
        if(res.ok) loadDataSistem();
      } catch(e) { console.error(e); }
    }

    window.onload = () => setFilter('menunggu');
  </script>
