<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Procurement ITK — Dashboard Staf Pengadaan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    }
    .custom-shadow {
      box-shadow: 0 4px 20px -2px rgba(15, 40, 71, 0.05), 0 2px 8px -1px rgba(15, 40, 71, 0.03);
    }
    .card-glow:hover {
      box-shadow: 0 12px 30px -4px rgba(15, 40, 71, 0.08);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="text-slate-800 pb-24 min-h-screen">

  <header class="bg-[#0f2847] text-white px-10 h-[80px] flex items-center justify-between shadow-md border-b border-white/10 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <div class="bg-amber-500 w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-md font-bold">⚙️</div>
      <div>
        <h1 class="text-lg font-extrabold tracking-tight block leading-tight">Sistem Procurement ITK</h1>
        <p class="text-[11px] text-slate-400 font-medium tracking-wide">Direktorat Logistik & Alur Pengadaan Sinkron</p>
      </div>
    </div>
    <div class="flex items-center gap-6">
      <div class="text-right">
        <span class="text-xs font-bold bg-blue-500/20 text-blue-300 px-3 py-1 rounded-full border border-blue-500/30">Aktor: Staf Pengadaan</span>
      </div>
      <button onclick="location.href='index.html'" class="bg-white/5 hover:bg-red-500 border border-white/10 hover:border-red-500 px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 shadow-sm">Keluar Portal</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-8 mt-10">
    
    <div class="grid grid-cols-2 md:grid-cols-6 gap-4 mb-10">
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 custom-shadow text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-amber-500"></div>
        <div class="text-2xl font-black text-amber-600 mb-1 tracking-tight" id="stat-1">0</div>
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">1. Cek PR</div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 custom-shadow text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-cyan-500"></div>
        <div class="text-2xl font-black text-cyan-600 mb-1 tracking-tight" id="stat-2">0</div>
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">2. Cari Vendor</div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 custom-shadow text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-indigo-500"></div>
        <div class="text-2xl font-black text-indigo-600 mb-1 tracking-tight" id="stat-3">0</div>
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">3. Tunggu Approve</div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 custom-shadow text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-purple-500"></div>
        <div class="text-2xl font-black text-purple-600 mb-1 tracking-tight" id="stat-4">0</div>
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">4. Serah Supplier</div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 custom-shadow text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-pink-500"></div>
        <div class="text-2xl font-black text-pink-600 mb-1 tracking-tight" id="stat-5">0</div>
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">5. Audit SJ</div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 custom-shadow text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-emerald-500"></div>
        <div class="text-2xl font-black text-emerald-600 mb-1 tracking-tight" id="stat-6">0</div>
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">6. Selesai Lunas</div>
      </div>
    </div>

    <div class="bg-white/80 backdrop-blur-md p-3 rounded-2xl border border-slate-200/60 shadow-sm mb-8">
      <div class="flex flex-wrap gap-1.5">
        <button onclick="setFilter('menunggu')" id="tab-menunggu" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2">
          📁 1. Cek PR
          <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md text-[10px] font-extrabold" id="badge-menunggu">0</span>
        </button>
        <button onclick="setFilter('diverifikasi')" id="tab-diverifikasi" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2">
          🤝 2. Cari Vendor
          <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md text-[10px] font-extrabold" id="badge-diverifikasi">0</span>
        </button>
        <button onclick="setFilter('diproses')" id="tab-diproses" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2">
          ⏳ 3. Tunggu Approve
          <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md text-[10px] font-extrabold" id="badge-diproses">0</span>
        </button>
        <button onclick="setFilter('disetujui')" id="tab-disetujui" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2">
          🚀 4. Serah Supplier
          <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md text-[10px] font-extrabold" id="badge-disetujui">0</span>
        </button>
        <button onclick="setFilter('diterima')" id="tab-diterima" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2">
          🔍 5. Audit SJ
          <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md text-[10px] font-extrabold" id="badge-diterima">0</span>
        </button>
        <button onclick="setFilter('selesai')" id="tab-selesai" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2">
          ✅ 6. History Selesai
          <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md text-[10px] font-extrabold" id="badge-selesai">0</span>
        </button>
      </div>
    </div>

    <div id="panelFormSakti" class="bg-white border border-amber-200 p-6 rounded-2xl mb-8 shadow-md hidden bg-gradient-to-r from-amber-50/50 to-transparent">
      <div class="flex items-center gap-2 mb-4">
        <span class="flex h-2 w-2 relative">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
        </span>
        <h3 class="text-xs font-bold uppercase tracking-wider text-amber-800" id="judulPanelSakti">Form Interaksi</h3>
      </div>
      <div id="kontenPanelSakti"></div>
    </div>

    <div class="space-y-4">
      <div class="flex items-center justify-between px-2">
        <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-blue-600"></span>
          Log Alur Berkas Pengadaan Aktif
        </h3>
      </div>
      
      <div class="flex flex-col gap-4" id="kontenCardsPR"></div>
    </div>

  </main>

  <script>
    const URL_API = "https://bgtgeltkbanlnvymalum.supabase.co/rest/v1/purchase_request";
    const KEY_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE";
    const HEADERS_APP = { "apikey": KEY_TOKEN, "Authorization": `Bearer ${KEY_TOKEN}`, "Content-Type": "application/json" };

    let currentFilter = 'menunggu';

    function safeUpdateText(id, text) {
      const el = document.getElementById(id);
      if (el) el.innerText = text;
    }

    async function loadDataSistem() {
      try {
        const res = await fetch(`${URL_API}?order=created_at.desc`, { method: "GET", headers: HEADERS_APP });
        const data = await res.json();
        
        const count1 = data.filter(i => i.status === 'menunggu' || !i.status).length;
        const count2 = data.filter(i => i.status === 'diverifikasi').length;
        const count3 = data.filter(i => i.status === 'diproses').length;
        const count4 = data.filter(i => i.status === 'disetujui').length;
        const count5 = data.filter(i => i.status === 'dikirim').length;
        
        // Klasifikasi history selesai lunas
        const count6 = data.filter(i => i.status !== 'menunggu' && i.status && i.status !== 'diverifikasi' && i.status !== 'diproses' && i.status !== 'disetujui' && i.status !== 'dikirim').length;

        safeUpdateText('stat-1', count1);
        safeUpdateText('stat-2', count2);
        safeUpdateText('stat-3', count3);
        safeUpdateText('stat-4', count4);
        safeUpdateText('stat-5', count5);
        safeUpdateText('stat-6', count6);

        safeUpdateText('badge-menunggu', count1);
        safeUpdateText('badge-diverifikasi', count2);
        safeUpdateText('badge-diproses', count3);
        safeUpdateText('badge-disetujui', count4);
        safeUpdateText('badge-diterima', count5);
        safeUpdateText('badge-selesai', count6);

        renderCards(data);
      } catch (e) { 
        console.error("Gagal memuat data:", e); 
      }
    }

    function setFilter(statusFilter) {
      currentFilter = statusFilter;
      
      const semuaTabId = ['tab-menunggu', 'tab-diverifikasi', 'tab-diproses', 'tab-disetujui', 'tab-diterima', 'tab-selesai'];
      
      semuaTabId.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.className = "px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2 text-slate-500 hover:bg-slate-100 hover:text-slate-800";
        }
      });
      
      const elActive = document.getElementById(`tab-${statusFilter}`);
      if (elActive) {
        elActive.className = "px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2 bg-[#0f2847] text-white shadow-sm";
      }

      loadDataSistem();
    }

    function renderCards(allData) {
      const container = document.getElementById('kontenCardsPR');
      if (!container) return;
      container.innerHTML = "";

      const filtered = allData.filter(item => {
        if (!item.status && currentFilter === 'menunggu') return true;
        if (currentFilter === 'selesai') {
          return item.status !== 'menunggu' && item.status && item.status !== 'diverifikasi' && item.status !== 'diproses' && item.status !== 'disetujui' && item.status !== 'dikirim';
        }
        if (currentFilter === 'diterima') return item.status === 'dikirim';
        return item.status === currentFilter;
      });

      if(filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200/80 p-12 text-center text-slate-400 text-xs custom-shadow">
              ✨ Tidak ada antrean berkas pengadaan pada kategori tab ini.
          </div>`;
        return;
      }

      filtered.forEach(item => {
        // BACKUP MULTI-KOLOM SUPPLIER (SUPPLIER_TERPILIH ATAU SUPPLIER BAWAAN)
        const vendor = item.supplier_terpilih || item.supplier || '—';
        
        // PEMERIKSAAN BERLAPIS NOMINAL HARGA AGAR TIDAK MUNCUL 0
        let hargaReal = Number(item.harga_vendor) || Number(item.harga) || Number(item.harga_supplier) || 0;
        
        // Simpan ke memori lokal jika di database sempat terbaca agar aman
        if (hargaReal > 0) {
          localStorage.setItem(`pengadaan_harga_${item.id}`, hargaReal);
        } else {
          const hgBackup = localStorage.getItem(`pengadaan_harga_${item.id}`);
          if (hgBackup) hargaReal = Number(hgBackup);
        }

        let warnaSamping = "bg-amber-500";
        let labelStatus = "Perlu Dicek Staf";
        let badgeWarna = "bg-amber-50 text-amber-700 border-amber-200";
        
        if(item.status === 'diverifikasi') { warnaSamping = "bg-cyan-500"; labelStatus = "Pencarian Vendor"; badgeWarna = "bg-cyan-50 text-cyan-700 border-cyan-200"; }
        if(item.status === 'diproses') { warnaSamping = "bg-indigo-500"; labelStatus = "Menunggu Approval Manajer"; badgeWarna = "bg-indigo-50 text-indigo-700 border-indigo-200"; }
        if(item.status === 'disetujui') { warnaSamping = "bg-purple-500"; labelStatus = "Disetujui! Siap Kirim Supplier"; badgeWarna = "bg-purple-50 text-purple-700 border-purple-200"; }
        if(item.status === 'dikirim') { warnaSamping = "bg-pink-500"; labelStatus = "Barang Sedang Dikirim Vendor"; badgeWarna = "bg-pink-50 text-pink-700 border-pink-200"; }
        
        if(item.status !== 'menunggu' && item.status !== 'diverifikasi' && item.status !== 'diproses' && item.status !== 'disetujui' && item.status !== 'dikirim') {
          warnaSamping = "bg-emerald-500"; 
          labelStatus = "Lunas & Arsip Selesai"; 
          badgeWarna = "bg-emerald-50 text-emerald-700 border-emerald-200";
        }

        let aksiTombol = "";
        if(!item.status || item.status === 'menunggu') {
          aksiTombol = `<button onclick="prosesStatus('${item.id}', 'diverifikasi')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition shadow-sm">✓ Verifikasi PR</button>`;
        } else if(item.status === 'diverifikasi') {
          aksiTombol = `<button onclick="bukaFormKunci('${item.id}', '${item.nama_barang}')" class="bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition shadow-sm">📄 Hubungkan Vendor & Harga</button>`;
        } else if(item.status === 'diproses') {
          aksiTombol = `<span class="text-indigo-700 font-bold text-xs bg-indigo-50 border border-indigo-200 px-4 py-2 rounded-xl flex items-center gap-1.5">⏳ Menunggu Meja Manajer</span>`;
        } else if(item.status === 'disetujui') {
          aksiTombol = `<button onclick="prosesStatus('${item.id}', 'dikirim')" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition shadow-sm">🚀 Serahkan ke Supplier (Kirim Barang)</button>`;
        } else if(item.status === 'dikirim') {
          aksiTombol = `<button onclick="prosesStatus('${item.id}', 'selesai')" class="bg-pink-600 hover:bg-pink-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition shadow-sm">🔍 Konfirmasi Selesai</button>`;
        } else {
          aksiTombol = `<span class="text-emerald-700 font-bold text-xs bg-emerald-50 border border-emerald-200 px-4 py-2 rounded-xl flex items-center gap-1.5">🔒 Arsip History Aman</span>`;
        }

        const catatanUser = item.catatan_penerimaan ? `<div class="mt-2 text-[11px] bg-slate-50 border p-2 rounded-lg text-slate-600">📝 <b>Catatan Penerimaan User:</b> ${item.catatan_penerimaan}</div>` : '';
        const shortId = item.id ? item.id.substring(0,6) : '0000';

        container.innerHTML += `
          <div class="bg-white border border-slate-200 rounded-2xl custom-shadow flex flex-col md:flex-row md:items-center justify-between gap-6 card-glow transition-all duration-300 relative overflow-hidden p-6 pl-8">
            <div class="absolute top-0 left-0 w-2 h-full ${warnaSamping}"></div>
            
            <div class="flex-1">
              <div class="flex items-center gap-3 mb-2">
                <h4 class="text-base font-extrabold text-slate-800 capitalize tracking-tight">${item.nama_barang || 'Item Kosong'}</h4>
                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 border rounded-md ${badgeWarna}">${labelStatus}</span>
              </div>
              <div class="grid grid-cols-2 md:grid-cols-4 gap-y-2 gap-x-4 text-xs font-medium text-slate-500">
                <div>Kuantitas: <span class="text-slate-800 font-bold">${item.jumlah || 1} Unit</span></div>
                <div>Vendor: <span class="text-blue-600 font-bold">${vendor}</span></div>
                <div>Harga Deal: <span class="text-slate-900 font-extrabold">${hargaReal > 0 ? 'Rp ' + hargaReal.toLocaleString('id-ID') : '—'}</span></div>
                <div class="text-[10px] font-mono text-slate-400">ID: #PR-${shortId}</div>
              </div>
              ${catatanUser}
            </div>
            
            <div class="flex items-center gap-2 self-end md:self-auto border-t md:border-t-0 pt-3 md:pt-0 w-full md:w-auto justify-end">
              ${aksiTombol}
              <button onclick="hapusBaris('${item.id}')" class="bg-slate-50 hover:bg-red-50 text-slate-400 hover:text-red-500 text-xs font-bold px-4 py-2.5 rounded-xl border border-slate-200/60 hover:border-red-200 transition-all duration-200">Hapus</button>
            </div>
          </div>
        `;
      });
    }

    function bukaFormKunci(id, namaBarang) {
      const pnl = document.getElementById('panelFormSakti');
      if (!pnl) return;
      pnl.classList.remove('hidden');
      document.getElementById('judulPanelSakti').innerText = `Langkah 2: Sinkronisasi Harga Rekanan — ${namaBarang}`;
      document.getElementById('kontenPanelSakti').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
          <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Nama Perusahaan Vendor</label>
            <input type="text" id="v_nama" placeholder="Contoh: PT. ITK Solusi Mandiri" class="h-11 px-4 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:border-blue-500 bg-white shadow-inner">
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Harga Penawaran Final (Satuan)</label>
            <input type="number" id="v_harga" placeholder="Rp 0" class="h-11 px-4 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:border-blue-500 bg-white shadow-inner">
          </div>
          <div class="flex gap-2">
            <button onclick="simpanKunciHarga('${id}')" class="bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-bold h-11 px-4 rounded-xl flex-1 shadow-sm transition">Kunci & Ajukan ke Manajer</button>
            <button onclick="document.getElementById('panelFormSakti').classList.add('hidden')" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold h-11 px-4 rounded-xl transition">Batal</button>
          </div>
        </div>
      `;
    }

    async function simpanKunciHarga(id) {
      const vendor = document.getElementById('v_nama').value.trim();
      const harga = parseFloat(document.getElementById('v_harga').value) || 0;
      if(!vendor || harga <= 0) { alert("Data vendor dan harga tidak valid!"); return; }

      // Kunci juga di memori lokal pengadaan sebelum kirim API
      localStorage.setItem(`pengadaan_harga_${id}`, harga);

      try {
        const res = await fetch(`${URL_API}?id=eq.${id}`, {
          method: "PATCH",
          headers: HEADERS_APP,
          body: JSON.stringify({ 
            supplier_terpilih: vendor, 
            harga_vendor: harga, 
            status: 'diproses' 
          })
        });
        if(res.ok) {
          document.getElementById('panelFormSakti').classList.add('hidden');
          setFilter('diproses');
        }
      } catch(e) { console.error(e); }
    }

    // FUNGSI SAKTI YANG SUDAH DIPERBAIKI (IKUT MEMPERTAHANKAN DATA LAMA SAAT MERUBAH STATUS)
    async function prosesStatus(id, statusBaru) {
      try {
        // 1. Tarik data baris aktif dari Supabase biar tahu isi aslinya
        const dapatkanData = await fetch(`${URL_API}?id=eq.${id}`, { method: "GET", headers: HEADERS_APP });
        const barisAktif = await dapatkanData.json();
        
        let payload = { status: statusBaru };
        
        // 2. Amankan data harga & nama supplier lama agar tidak terhapus / ter-override kosong
        if (barisAktif && barisAktif.length > 0) {
          const hgLama = Number(barisAktif[0].harga_vendor) || Number(barisAktif[0].harga) || Number(localStorage.getItem(`pengadaan_harga_${id}`)) || 0;
          payload.harga_vendor = hgLama;
          payload.harga = hgLama;
          payload.supplier_terpilih = barisAktif[0].supplier_terpilih || barisAktif[0].supplier || '';
        }

        // 3. Eksekusi PATCH dengan isi komplit
        const res = await fetch(`${URL_API}?id=eq.${id}`, {
          method: "PATCH",
          headers: HEADERS_APP,
          body: JSON.stringify(payload)
        });
        
        if(res.ok) {
          setFilter(statusBaru);
        }
      } catch(e) { 
        console.error(e); 
      }
    }

    async function hapusBaris(id) {
      if(!confirm("Apakah Anda yakin ingin menghapus bersih data ini?")) return;
      try {
        const res = await fetch(`${URL_API}?id=eq.${id}`, { method: "DELETE", headers: HEADERS_APP });
        if(res.ok) loadDataSistem();
      } catch(e) { console.error(e); }
    }

    window.onload = () => setFilter('menunggu');
  </script>
</body>
</html>
