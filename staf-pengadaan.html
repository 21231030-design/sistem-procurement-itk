<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Staf Pengadaan - ITK Procurement</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0f2847; --navy-mid: #1a3a63;
      --accent: #3b82f6; --accent-soft: #dbeafe;
      --success: #10b981; --success-soft: #d1fae5;
      --danger: #ef4444; --danger-soft: #fee2e2;
      --warn: #f59e0b; --warn-soft: #fef3c7;
      --purple: #7c3aed;
      --surface: #ffffff; --bg: #f0f4f8;
      --border: #e2e8f0; --text: #1e293b; --muted: #64748b;
      --radius: 12px; --radius-sm: 8px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    nav {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      padding: 0 2rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 16px rgba(15,40,71,0.18);
    }
    .nav-brand { display: flex; align-items: center; gap: 12px; }
    .nav-logo { width: 36px; height: 36px; background: rgba(255,255,255,0.12); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .nav-title { font-size: 15px; font-weight: 600; color: #fff; }
    .nav-sub { font-size: 12px; color: rgba(255,255,255,0.5); }
    .btn-logout { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 500; }

    .container { max-width: 1200px; margin: 0 auto; padding: 1.75rem 1.5rem; }

    .stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1rem; text-align: center; }
    .stat-num { font-size: 24px; font-weight: 600; font-family: 'DM Mono', monospace; }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px; margin-bottom: 1.5rem; width: fit-content; }
    .tab { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); border: none; background: none; }
    .tab.active { background: var(--navy); color: #fff; }
    .tab-badge { display: inline-flex; align-items: center; justify-content: center; padding: 2px 6px; border-radius: 10px; font-size: 10px; font-weight: 700; margin-left: 6px; background: var(--danger); color: #fff; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; margin-bottom: 1rem; }
    .card-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); background: #fafbfa; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--navy); }
    .card-body { padding: 1.5rem; }

    .pr-item { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1.25rem; margin-bottom: 0.75rem; background: #fff; }
    .pr-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .pr-name { font-size: 16px; font-weight: 600; color: var(--navy); }
    .pr-meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .pr-actions { display: flex; gap: 8px; margin-top: 14px; }

    .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 40px; text-transform: uppercase; }
    .badge.menunggu { background: var(--warn-soft); color: #92400e; }
    .badge.diverifikasi { background: #ccfbf1; color: #134e4a; }
    .badge.diproses { background: #e0f2fe; color: #0369a1; }
    .badge.menunggu_approval { background: #f3e8ff; color: #6b21a8; }

    .btn { border: none; border-radius: 6px; padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-navy { background: var(--navy); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: transparent; color: var(--muted); border: 1px solid var(--border); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15,40,71,0.5); z-index: 200; display: none; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(2px); }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 560px; overflow: hidden; }
    .modal-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 15px; font-weight: 600; color: var(--navy); }
    .modal-close { background: none; border: none; cursor: pointer; font-size: 22px; color: var(--muted); }
    .modal-body { padding: 1.5rem; max-height: 60vh; overflow-y: auto; }
    .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); background: #f8fafc; display: flex; gap: 10px; justify-content: flex-end; }

    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .field input { width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 14px; outline: none; }

    .info-box { background: var(--accent-soft); border: 1px solid #bfdbfe; border-radius: var(--radius-sm); padding: 12px; margin-bottom: 1.25rem; font-size: 13px; color: #1e40af; }
    .quotation-row { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 8px; background: #fff; }
    .quotation-row.quotation-selected { border-color: var(--success); background: var(--success-soft); }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="nav-logo">📦</div>
    <div>
      <div class="nav-title">Sistem Pengadaan ITK</div>
      <div class="nav-sub">Modul Terintegrasi Hulu ke Hilir &mdash; Staf Pengadaan</div>
    </div>
  </div>
  <button class="btn-logout" onclick="window.location.href='index.html'">Keluar</button>
</nav>

<div class="container">

  <div class="stat-row">
    <div class="stat-card"><div class="stat-num" id="sCekPR" style="color:#92400e">0</div><div class="stat-label">1. Verifikasi PR</div></div>
    <div class="stat-card"><div class="stat-num" id="sQuotation" style="color:#134e4a">0</div><div class="stat-label">2. Input Vendor</div></div>
    <div class="stat-card"><div class="stat-num" id="sEvaluasi" style="color:#0369a1">0</div><div class="stat-label">3. Evaluasi Vendor</div></div>
    <div class="stat-card"><div class="stat-num" id="sVerifSJ" style="color:#7c3aed">0</div><div class="stat-label">4. Total Ajuan</div></div>
    <div class="stat-card"><div class="stat-num" id="sSelesai" style="color:#065f46">0</div><div class="stat-label">5. Selesai Lunas</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('cek-pr', this)">1. Verifikasi PR <span class="tab-badge" id="badgeCekPR">0</span></button>
    <button class="tab" onclick="switchTab('quotation', this)">2. Input Quotation <span class="tab-badge" id="badgeQuotation">0</span></button>
    <button class="tab" onclick="switchTab('evaluasi', this)">3. Evaluasi & Draf PO <span class="tab-badge" id="badgeEvaluasi">0</span></button>
    <button class="tab" onclick="switchTab('riwayat', this)">Semua Arsip (Reset Database)</button>
  </div>

  <div class="tab-panel active" id="tab-cek-pr"><div class="card"><div class="card-body" id="listCekPR"></div></div></div>
  <div class="tab-panel" id="tab-quotation"><div class="card"><div class="card-body" id="listQuotation"></div></div></div>
  <div class="tab-panel" id="tab-evaluasi"><div class="card"><div class="card-body" id="listEvaluasi"></div></div></div>
  <div class="tab-panel" id="tab-riwayat"><div class="card"><div class="card-body" id="listRiwayat"></div></div></div>

</div>

<div class="modal-overlay" id="modalQuotation">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Input Penawaran Harga Komersial Vendor</span>
      <button class="modal-close" onclick="closeModal('modalQuotation')">×</button>
    </div>
    <div class="modal-body">
      <div class="info-box" id="qInfoPR"></div>
      <div id="qSupplierList"></div>
      <button class="btn btn-outline" onclick="tambahSupplierRow()" style="width:100%; justify-content:center; margin-top:8px;">+ Tambah Alternatif Vendor</button>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modalQuotation')">Batal</button>
      <button class="btn btn-primary" onclick="simpanQuotation()">Simpan Semua Penawaran</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalEvaluasi">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Kunci Pemenang & Kirim ke Manajer</span>
      <button class="modal-close" onclick="closeModal('modalEvaluasi')">×</button>
    </div>
    <div class="modal-body">
      <div class="info-box" id="evalInfoPR"></div>
      <div id="evalQuotationList"></div>
      <div class="field" style="margin-top:1.25rem;">
        <label>Nomor Urut Dokumen PO Kontrak</label>
        <input type="text" id="draftNoPO">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modalEvaluasi')">Batal</button>
      <button class="btn btn-navy" onclick="simpanDrafPOTerpadu()">🚀 Kunci & Kirim Langsung ke Manajer</button>
    </div>
  </div>
</div>

<script>
  const SB_URL = "https://bgtgeltkbanlnvymalum.supabase.co";
  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE";
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const MAP_STATUS = {
    menunggu: 'Menunggu Verifikasi', diverifikasi: 'Proses Input Vendor', diproses: 'Evaluasi Vendor',
    po_dibuat: 'Menunggu Approval Manajer', menunggu_approval: 'Menunggu Approval Manajer', disetujui: 'PO Terbit Aktif',
    dikirim: 'Barang Sedang Dikirim', barang_diterima: 'Logistik Sampai Gudang', invoice_dikirim: 'Invoice Diterima', selesai: 'Selesai Lunas'
  };

  let currentPRId = null, selectedQuotationId = null, rowCount = 0;

  function switchTab(id, el) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + id).classList.add('active');
    el.classList.add('active');
  }
  function openModal(id) { document.getElementById(id).classList.add('show'); }
  function closeModal(id) { document.getElementById(id).classList.remove('show'); }
  function fmtRupiah(n) { return 'Rp ' + Number(n).toLocaleString('id-ID'); }

  async function muatSemuaData() {
    await Promise.all([muatCekPR(), muatQuotation(), muatEvaluasi(), muatRiwayat()]);
  }

  async function muatCekPR() {
    const { data } = await sb.from('purchase_request').select('*').eq('status', 'menunggu').order('created_at', {ascending:true});
    const el = document.getElementById('listCekPR');
    document.getElementById('badgeCekPR').textContent = data ? data.length : 0;
    document.getElementById('sCekPR').textContent = data ? data.length : 0;

    if(!data || data.length === 0) { el.innerHTML = `<div class="empty-state">Tidak ada dokumen PR baru.</div>`; return; }
    el.innerHTML = data.map(pr => `
      <div class="pr-item">
        <div class="pr-row">
          <div><div class="pr-name">${pr.nama_barang}</div><div class="pr-meta">Volume: <b>${pr.jumlah} Unit</b></div></div>
          <span class="badge menunggu">Baru</span>
        </div>
        <div class="pr-actions"><button class="btn btn-success" onclick="eksekusiLolosPR('${pr.id}')">✓ Lolos Verifikasi</button></div>
      </div>`).join('');
  }

  async function eksekusiLolosPR(id) {
    await sb.from('purchase_request').update({ status: 'diverifikasi' }).eq('id', id);
    await muatSemuaData();
  }

  async function muatQuotation() {
    const { data } = await sb.from('purchase_request').select('*').eq('status', 'diverifikasi').order('created_at', {ascending:true});
    const el = document.getElementById('listQuotation');
    document.getElementById('badgeQuotation').textContent = data ? data.length : 0;
    document.getElementById('sQuotation').textContent = data ? data.length : 0;

    if(!data || data.length === 0) { el.innerHTML = `<div class="empty-state">Tidak ada item yang menunggu vendor.</div>`; return; }
    el.innerHTML = data.map(pr => `
      <div class="pr-item">
        <div class="pr-row">
          <div><div class="pr-name">${pr.nama_barang}</div><div class="pr-meta">Kuantitas: <b>${pr.jumlah} Unit</b></div></div>
          <span class="badge diverifikasi">Cari Vendor</span>
        </div>
        <div class="pr-actions"><button class="btn btn-primary" onclick="bukaModalQuotation('${pr.id}', '${pr.nama_barang}', ${pr.jumlah})">➕ Input Penawaran</button></div>
      </div>`).join('');
  }

  function bukaModalQuotation(id, nama, jml) {
    currentPRId = id; rowCount = 0;
    document.getElementById('qInfoPR').textContent = `📋 Komoditas: ${nama} (${jml} Unit)`;
    document.getElementById('qSupplierList').innerHTML = '';
    tambahSupplierRow(); tambahSupplierRow();
    openModal('modalQuotation');
  }

  function tambahSupplierRow() {
    rowCount++; const n = rowCount;
    const div = document.createElement('div'); div.className = 'quotation-row';
    div.innerHTML = `<div style="display:grid; grid-template-columns: 1.2fr 1fr; gap:10px;"><input type="text" placeholder="Nama Vendor" id="v_nama_${n}" required><input type="number" placeholder="Harga Satuan" id="v_harga_${n}" required></div>`;
    document.getElementById('qSupplierList').appendChild(div);
  }

  async function simpanQuotation() {
    const records = [];
    for(let i=1; i<=rowCount; i++) {
      const n = document.getElementById('v_nama_'+i)?.value.trim(), h = document.getElementById('v_harga_'+i)?.value;
      if(n && h) records.push({ pr_id: currentPRId, nama_supplier: n, harga: parseFloat(h), status: 'menunggu' });
    }
    if(records.length === 0) return;
    await sb.from('quotation').insert(records);
    await sb.from('purchase_request').update({ status: 'diproses' }).eq('id', currentPRId);
    closeModal('modalQuotation'); await muatSemuaData();
    switchTab('evaluasi', document.querySelectorAll('.tab')[2]);
  }

  async function muatEvaluasi() {
    const { data } = await sb.from('purchase_request').select('*').in('status', ['diproses', 'menunggu_approval', 'po_dibuat']).order('created_at', {ascending:true});
    const el = document.getElementById('listEvaluasi');
    document.getElementById('badgeEvaluasi').textContent = data ? data.length : 0;
    document.getElementById('sEvaluasi').textContent = data ? data.filter(d => d.status === 'diproses').length : 0;
    document.getElementById('sVerifSJ').textContent = data ? data.filter(d => ['menunggu_approval', 'po_dibuat'].includes(d.status)).length : 0;

    if(!data || data.length === 0) { el.innerHTML = `<div class="empty-state">Tidak ada draf penawaran.</div>`; return; }

    const barisRender = await Promise.all(data.map(async pr => {
      const { data: qts } = await sb.from('quotation').select('*').eq('pr_id', pr.id).order('harga', {ascending:true});
      let aksi = (pr.status === 'diproses') 
        ? `<button class="btn btn-navy" onclick="bukaModalEvaluasi('${pr.id}', '${pr.nama_barang}', ${pr.jumlah})">⚖️ Pilih Pemenang & Kirim</button>`
        : `<span style="font-size:12px; color:var(--purple); font-weight:600;">🚀 Berkas Telah Terkirim Langsung ke Manajer</span>`;

      const info = qts ? qts.map(q => `&bull; <b>${q.status==='dipilih'?'[OK] ':''}${q.nama_supplier}</b> (${fmtRupiah(q.harga)})`).join('<br>') : '';
      return `<div class="pr-item"><div class="pr-row"><div><div class="pr-name">${pr.nama_barang}</div><div class="pr-meta">${info}</div></div><span class="badge ${pr.status}">${MAP_STATUS[pr.status] || pr.status}</span></div><div class="pr-actions">${aksi}</div></div>`;
    }));
    el.innerHTML = barisRender.join('');
  }

  async function bukaModalEvaluasi(id, nama, jml) {
    currentPRId = id; selectedQuotationId = null;
    document.getElementById('evalInfoPR').textContent = `⚖️ Komparasi: ${nama}`;
    document.getElementById('draftNoPO').value = 'PO/ITK/' + new Date().getFullYear() + '/' + Math.floor(1000 + Math.random()*9000);
    const { data } = await sb.from('quotation').select('*').eq('pr_id', id).order('harga', {ascending:true});
    document.getElementById('evalQuotationList').innerHTML = data.map(q => `
      <div class="quotation-row" id="qbox_${q.id}" onclick="pilihVendorPemenang('${q.id}')" style="cursor:pointer;">
        <div style="display:flex; justify-content:space-between;"><b>${q.nama_supplier}</b> <span style="color:var(--accent)">${fmtRupiah(q.harga)}</span></div>
      </div>`).join('');
    openModal('modalEvaluasi');
  }

  function pilihVendorPemenang(qId) {
    selectedQuotationId = qId;
    document.querySelectorAll('[id^="qbox_"]').forEach(el => el.classList.remove('quotation-selected'));
    document.getElementById('qbox_' + qId).classList.add('quotation-selected');
  }

  // ALUR ANTI-LOG GAIB: STATUS DOUBLE CHECK AGAR MANAJER PASTI BISA MEMBACA
  async function simpanDrafPOTerpadu() {
    const noPo = document.getElementById('draftNoPO').value.trim();
    if(!noPo) return;
    let vendor = "Mitra Utama", harga = 500000;

    if(selectedQuotationId) {
      const { data: q } = await sb.from('quotation').select('*').eq('id', selectedQuotationId).single();
      vendor = q.nama_supplier; harga = q.harga;
      await sb.from('quotation').update({ status: 'dipilih' }).eq('id', selectedQuotationId);
    }

    await sb.from('purchase_order').delete().eq('pr_id', currentPRId);
    await sb.from('purchase_order').insert({
      pr_id: currentPRId, no_po: noPo, nama_supplier: vendor, harga_total: harga, total_harga: harga, status: 'menunggu_approval', tanggal_po: new Date().toISOString()
    });

    // Tembak status ke 'menunggu_approval' agar query manajer tembus
    await sb.from('purchase_request').update({ status: 'menunggu_approval', harga_estimasi: harga }).eq('id', currentPRId);

    closeModal('modalEvaluasi'); await muatSemuaData();
    alert("Sukses! Data dikunci dan dikirim ke Manajer.");
  }

  async function muatRiwayat() {
    const { data } = await sb.from('purchase_request').select('*').order('created_at', {ascending:false});
    const el = document.getElementById('listRiwayat');
    if(!data || data.length === 0) { el.innerHTML = `Kosong.`; return; }
    el.innerHTML = `<table style="width:100%; font-size:13px;">${data.map(d => `<tr><td><b>${d.nama_barang}</b></td><td><span class="badge ${d.status}">${MAP_STATUS[d.status]||d.status}</span></td><td><button class="btn btn-danger" style="padding:4px;" onclick="forceDelete('${d.id}')">🗑️ Reset Item</button></td></tr>`).join('')}</table>`;
  }

  async function forceDelete(id) {
    if(confirm("Hapus item ini?")) {
      await sb.from('quotation').delete().eq('pr_id', id);
      await sb.from('invoices').delete().eq('pr_id', id);
      await sb.from('purchase_order').delete().eq('pr_id', id);
      await sb.from('purchase_request').delete().eq('id', id);
      await muatSemuaData();
    }
  }

  window.onload = muatSemuaData;
</script>
</body>
</html>
