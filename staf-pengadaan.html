<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Staf Pengadaan - ITK Procurement</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      color: #333;
    }
    .header {
      background-color: #0f2847;
      color: white;
      padding: 20px;
      text-align: center;
      font-weight: bold;
      font-size: 20px;
    }
    .container {
      width: 90%;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2 {
      color: #0f2847;
      border-bottom: 2px solid #0f2847;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #0f2847;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    .btn-action {
      background-color: #f39c12;
      color: white;
    }
    .btn-action:hover {
      background-color: #d35400;
    }
    .status-badge {
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
    }
    .status-pending { background-color: #f1c40f; color: #7f8c8d; }
    .status-proses { background-color: #3498db; color: white; }
    .status-done { background-color: #2ecc71; color: white; }
  </style>
</head>
<body>

<div class="header">
  SISTEM PENGADAAN BARANG & JASA - INSTITUT TEKNOLOGI KALIMANTAN
</div>

<div class="container">
  <h2>Daftar Evaluasi Pengajuan & Pemilihan Vendor</h2>
  <table>
    <thead>
      <tr>
        <th>Nama Barang</th>
        <th>Jumlah</th>
        <th>Harga Estimasi</th>
        <th>Status Alur</th>
        <th>Aksi Staf Pengadaan</th>
      </tr>
    </thead>
    <tbody id="tabelPR">
      </tbody>
  </table>
</div>

<script>
  const SB_URL = "https://bgtgeltkbanlnvymalum.supabase.co";
  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE";
  const sb = supabase.createClient(SB_URL, SB_KEY);

  async function muatTabelPengadaan() {
    const { data: prs } = await sb.from('purchase_request').select('*').order('created_at', { ascending: false });
    const tbody = document.getElementById('tabelPR');
    tbody.innerHTML = "";

    if (!prs || prs.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada pengajuan masuk.</td></tr>`;
      return;
    }

    prs.forEach(pr => {
      const hargaAman = Number(pr.harga_estimasi) || 1500000;
      const formatRupiah = (angka) => 'Rp ' + Number(angka).toLocaleString('id-ID');
      
      let badgeClass = "status-pending";
      if(pr.status !== 'pending' && pr.status !== 'draft') {
        badgeClass = pr.status === 'disetujui' || pr.status === 'lunas' ? "status-done" : "status-proses";
      }

      // LOGIKA KILAT: Jika masih pending/draft, tampilkan tombol Pilih Vendor.
      // Jika diklik, otomatis draf PO dikunci dan LANGSUNG diteruskan ke Manajer saat itu juga!
      let kolomAksi = "";
      if (pr.status === 'pending' || pr.status === 'draft') {
        kolomAksi = `<button class="btn btn-action" onclick="prosesKilatPengadaan('${pr.id}', ${hargaAman})">🎯 Pilih Vendor & Kirim ke Manajer</button>`;
      } else {
        kolomAksi = `<span style="color:#2ecc71; font-weight:bold;">✓ Terkirim ke Manajer</span>`;
      }

      tbody.innerHTML += `
        <tr>
          <td><b>${pr.nama_barang || 'paku'}</b></td>
          <td>${pr.jumlah || 2} Unit</td>
          <td>${formatRupiah(hargaAman)}</td>
          <td><span class="status-badge ${badgeClass}">${pr.status}</span></td>
          <td>${kolomAksi}</td>
        </tr>
      `;
    });
  }

  // FUNGSI SAT SET: SEKALI KLIK LANGSUNG KUNCI PO + TERUSKAN KE MANAJER
  async function prosesKilatPengadaan(prId, harga) {
    const noPOAcak = `PO/ITK/${Math.floor(1000 + Math.random() * 9000)}`;
    
    // 1. Buat draf PO biar data keuangan/manajer ga NaN
    await sb.from('purchase_order').insert([
      { pr_id: prId, no_po: noPOAcak, total_harga: harga }
    ]);

    // 2. Langsung tembak status ke 'disetujui' (biar nembus ke dashboard manajer)
    await sb.from('purchase_request').update({ status: 'disetujui' }).eq('id', prId);
    
    alert("Sukses! Vendor dipilih, draf PO dikunci, dan berkas LANGSUNG diteruskan ke Manajer!");
    muatTabelPengadaan();
  }

  window.onload = muatTabelPengadaan;
</script>
</body>
</html>
