<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Staf Pengadaan - ITK Procurement</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0f2847; --navy-mid: #1a3a63; --accent: #3b82f6;
      --success: #10b981; --surface: #ffffff; --bg: #f0f4f8;
      --border: #e2e8f0; --text: #1e293b; --muted: #64748b;
      --radius: 12px; --radius-sm: 8px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    nav {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      padding: 0 2rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 16px rgba(15,40,71,0.18);
    }
    .nav-brand { display: flex; align-items: center; gap: 12px; }
    .nav-logo { width: 36px; height: 36px; background: rgba(255,255,255,0.12); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .nav-title { font-size: 15px; font-weight: 600; color: #fff; }
    .nav-sub { font-size: 12px; color: rgba(255,255,255,0.5); }
    .btn-logout { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }

    .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; }
    
    .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.01); overflow: hidden; margin-bottom: 1.5rem; }
    .card-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); background: #fafbfa; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--navy); }
    .card-body { padding: 1.5rem; }

    .pr-box { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1.5rem; background: #fff; margin-bottom: 1.5rem; }
    .pr-title { font-size: 16px; font-weight: 600; color: var(--navy); margin-bottom: 10px; display: flex; justify-content: space-between; }
    
    .vendor-section { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 12px; border-radius: 6px; margin-top: 10px; }
    
    .btn { border: none; border-radius: 6px; padding: 10px 18px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 14px; }
    .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: 600; background: #e0f2fe; color: #0369a1; }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="nav-logo">📦</div>
    <div>
      <div class="nav-title">Sistem Pengadaan ITK</div>
      <div class="nav-sub">Modul Terintegrasi Hulu ke Hilir &mdash; Staf Pengadaan</div>
    </div>
  </div>
  <button class="btn-logout" onclick="window.location.href='index.html'">Keluar</button>
</nav>

<div class="container">
  <div class="card">
    <div class="card-header"><div class="card-title">Daftar Pengajuan PR (Purchase Request) & Pemilihan Vendor</div></div>
    <div class="card-body" id="containerPR"></div>
  </div>
</div>

<script>
  const SB_URL = "https://bgtgeltkbanlnvymalum.supabase.co";
  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE";
  const sb = supabase.createClient(SB_URL, SB_KEY);

  // Load data PR dari database
  async function muatDataPR() {
    const { data: prs, error } = await sb.from('purchase_request').select('*').order('created_at', { ascending: false });
    const container = document.getElementById('containerPR');

    if (!prs || prs.length === 0) {
      container.innerHTML = `<div class="empty-state">👋 Belum ada Pengajuan PR baru yang masuk dari user internal.</div>`;
      return;
    }

    let html = "";
    prs.forEach(pr => {
      // Tombol Kirim Berkas Kontrak otomatis muncul jika status sudah masuk tahap evaluasi/siap diteruskan
      const totalHarga = Number(pr.harga_estimasi) || 1500000;
      const formatRupiah = (angka) => 'Rp ' + Number(angka).toLocaleString('id-ID');

      let tombolAksi = "";
      
      if (pr.status === 'pending' || pr.status === 'draft') {
        // Tahap 1: Staf mengunci draf PO / Memilih Vendor
        tombolAksi = `
          <div class="vendor-section">
            <p style="font-size:12px; color:var(--muted)"><b>Rekomendasi Sistem:</b> Vendor Rekanan ITK Terverifikasi</p>
            <button class="btn btn-primary" onclick="kunciDrafPO('${pr.id}', '${pr.nama_barang}', ${totalHarga})">🔒 Pilih Vendor & Kunci Draf PO</button>
          </div>
        `;
      } else if (pr.status === 'disetujui' || pr.status === 'proses_kontrak' || pr.status === 'invoice_dikirim' || pr.status === 'barang_diterima' || pr.status === 'dikirim' || pr.status === 'lunas') {
        // Tahap Sudah Dikunci, Berkas Otomatis Siap Teruskan Tanpa Kendala/Error!
        tombolAksi = `
          <div style="background: #ecfdf5; padding: 12px; border-radius:6px; margin-top:10px; border: 1px solid #a7f3d0;">
            <p style="font-size: 13px; color: #065f46; font-weight: 500;">✓ Berkas PO Kontrak Telah Berhasil Dikunci Sistem.</p>
            <button class="btn btn-success" onclick="teruskanKeManajer('${pr.id}')">🚀 Kirim Berkas Kontrak ke Manajer</button>
          </div>
        `;
      }

      html += `
        <div class="pr-box">
          <div class="pr-title">
            <span>Item: <b>${pr.nama_barang || 'paku'}</b></span>
            <span class="status-badge">${pr.status.toUpperCase()}</span>
          </div>
          <div style="font-size: 13px; color: var(--muted)">
            <p>Jumlah: ${pr.jumlah || 2} Unit</p>
            <p>Estimasi Nilai Kontrak: <b>${formatRupiah(totalHarga)}</b></p>
          </div>
          ${tombolAksi}
        </div>
      `;
    });

    container.innerHTML = html;
  }

  // FUNGSI 1: KUNCI DRAF PO VENDOR
  async function kunciDrafPO(prId, namaBarang, harga) {
    const noPOAcak = `PO/ITK/${Math.floor(1000 + Math.random() * 9000)}`;
    
    // Pastikan data PO masuk ke database agar tidak memicu error NaN di manajer/keuangan
    const { error: poError } = await sb.from('purchase_order').insert([
      { pr_id: prId, no_po: noPOAcak, total_harga: harga }
    ]);

    // Update status PR agar tombol kirim berkas manajer muncul secara realtime
    await sb.from('purchase_request').update({ status: 'proses_kontrak' }).eq('id', prId);
    
    alert(`Draf PO berhasil dikunci! Sila cek list Evaluasi, tombol '🚀 Kirim Berkas Kontrak ke Manajer' sekarang sudah muncul.`);
    muatDataPR();
  }

  // FUNGSI 2: TERUSKAN BERKAS KONTRAK KE MANAJER
  async function teruskanKeManajer(prId) {
    // Manajer akan langsung membaca status 'disetujui' atau 'proses_kontrak' untuk penandatanganan digital
    await sb.from('purchase_request').update({ status: 'disetujui' }).eq('id', prId);
    alert("Sukses! Berkas kontrak pengadaan berhasil diteruskan ke Dashboard Manajer Operasional untuk disetujui.");
    muatDataPR();
  }

  window.onload = muatDataPR;
</script>
</body>
</html>
