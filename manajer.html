<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Approval Manajer - ITK Procurement</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0f2847; --navy-mid: #1a3a63;
      --accent: #3b82f6; --success: #10b981; --success-soft: #d1fae5;
      --purple: #7c3aed; --purple-soft: #ede9fe;
      --surface: #ffffff; --bg: #f0f4f8;
      --border: #e2e8f0; --text: #1e293b; --muted: #64748b;
      --radius: 12px; --radius-sm: 8px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    nav {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      padding: 0 2rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 16px rgba(15,40,71,0.18);
    }
    .nav-brand { display: flex; align-items: center; gap: 12px; }
    .nav-logo { width: 36px; height: 36px; background: rgba(255,255,255,0.12); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .nav-title { font-size: 15px; font-weight: 600; color: #fff; }
    .nav-sub { font-size: 12px; color: rgba(255,255,255,0.5); }

    .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; }
    
    .welcome-card { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .welcome-title { font-size: 18px; font-weight: 600; color: var(--navy); }
    .welcome-desc { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .badge-count { background: #ef4444; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }

    .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.01); }
    .card-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); background: #fafbfa; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--navy); }
    .card-body { padding: 1.5rem; }

    .po-item { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1.25rem; margin-bottom: 1rem; background: #fff; border-left: 4px solid var(--purple); }
    .po-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .po-name { font-size: 16px; font-weight: 600; color: var(--navy); }
    .po-meta { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
    .po-price { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 600; color: var(--accent); background: #eff6ff; padding: 4px 10px; border-radius: 6px; }
    .po-actions { margin-top: 14px; display: flex; gap: 10px; }

    .btn { border: none; border-radius: 6px; padding: 8px 16px; font-size: 12px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-success { background: var(--success); color: #fff; }
    
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="nav-logo">👔</div>
    <div>
      <div class="nav-title">Sistem Pengadaan ITK</div>
      <div class="nav-sub">Modul Terintegrasi Hulu ke Hilir &mdash; Portal Approval Manajer</div>
    </div>
  </div>
</nav>

<div class="container">
  <div class="welcome-card">
    <div>
      <div class="welcome-title">Selamat Datang, Manajer Operasional</div>
      <div class="welcome-desc">Silakan tinjau keabsahan harga draf kontrak sebelum memberikan tanda tangan digital (PO Terbit).</div>
    </div>
    <div class="badge-count" id="txtCount">0 Perlu Review</div>
  </div>

  <div class="card">
    <div class="card-header"><div class="card-title">Dokumen Masuk Perlu Persetujuan Segera</div></div>
    <div class="card-body" id="containerPO"></div>
  </div>
</div>

<script>
  const SB_URL = "https://bgtgeltkbanlnvymalum.supabase.co";
  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE";
  const sb = supabase.createClient(SB_URL, SB_KEY);

  async function muatDrafPO() {
    // KUNCI PERBAIKAN: Menarik status 'menunggu_approval' secara akurat!
    const { data: prs, error: err1 } = await sb.from('purchase_request')
      .select('*')
      .eq('status', 'menunggu_approval')
      .order('created_at', { ascending: true });

    const container = document.getElementById('containerPO');
    
    if (!prs || prs.length === 0) {
      document.getElementById('txtCount').textContent = "0 Perlu Review";
      container.innerHTML = `<div class="empty-state">🎉 Bersih! Tidak ada draf PO kontrak yang menunggu persetujuan Anda saat ini.</div>`;
      return;
    }

    document.getElementById('txtCount').textContent = `${prs.length} Perlu Review`;
    
    // Tarik data purchase_order pendukung
    const barisRender = await Promise.all(prs.map(async (pr) => {
      const { data: po } = await sb.from('purchase_order').select('*').eq('pr_id', pr.id).maybeSingle();
      
      const noPO = po ? po.no_po : 'PO/PENDING/' + new Date().getFullYear();
      const vendor = po ? po.nama_supplier : 'Vendor Terpilih';
      const hargaTotal = pr.harga_estimasi ? pr.harga_estimasi : (po ? po.harga_total : 0);

      return `
        <div class="po-item">
          <div class="po-row">
            <div style="flex:1;">
              <div class="po-name">${pr.nama_barang}</div>
              <div class="po-meta">
                Nomor Draf PO: <b>${noPO}</b><br>
                Vendor Pemenang: <b>${vendor}</b> &bull; Kuantitas: <b>${pr.jumlah} Unit</b>
              </div>
            </div>
            <div class="po-price">${'Rp ' + Number(hargaTotal).toLocaleString('id-ID')}</div>
          </div>
          <div class="po-actions">
            <button class="btn btn-success" onclick="setujuiPO('${pr.id}')">✍️ Setujui & Terbitkan PO Resmi</button>
          </div>
        </div>`;
    }));

    container.innerHTML = barisRender.join('');
  }

  async function setujuiPO(prId) {
    if(confirm("Apakah Anda yakin ingin menyetujui dokumen pengadaan ini dan menerbitkannya ke Supplier?")) {
      // 1. Naikkan status utama ke 'disetujui' agar masuk ke radar supplier
      await sb.from('purchase_request').update({ status: 'disetujui' }).eq('id', prId);
      
      // 2. Update juga status di tabel purchase_order menjadi 'disetujui'
      await sb.from('purchase_order').update({ status: 'disetujui' }).eq('pr_id', prId);
      
      alert("Sukses! Dokumen PO telah ditandatangani digital dan diterbitkan secara resmi.");
      await muatDrafPO();
    }
  }

  window.onload = muatDrafPO;
</script>
</body>
</html>
