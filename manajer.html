<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Procurement ITK — Dashboard Manajer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    }
    .custom-shadow {
      box-shadow: 0 4px 20px -2px rgba(15, 40, 71, 0.05), 0 2px 8px -1px rgba(15, 40, 71, 0.03);
    }
    .card-glow:hover {
      box-shadow: 0 12px 30px -4px rgba(15, 40, 71, 0.08);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="text-slate-800 pb-24 min-h-screen">

  <header class="bg-[#0f2847] text-white px-10 h-[80px] flex items-center justify-between shadow-md border-b border-white/10 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <div class="bg-indigo-600 w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-md font-bold">💼</div>
      <div>
        <h1 class="text-lg font-extrabold tracking-tight block leading-tight">Sistem Procurement ITK</h1>
        <p class="text-[11px] text-slate-400 font-medium tracking-wide">Panel Persetujuan Anggaran & Approval Manajer</p>
      </div>
    </div>
    <div class="flex items-center gap-6">
      <div class="text-right">
        <span class="text-xs font-bold bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/30">Aktor: Manajer Pengadaan</span>
      </div>
      <button onclick="location.href='index.html'" class="bg-white/5 hover:bg-red-500 border border-white/10 hover:border-red-500 px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 shadow-sm">Keluar Portal</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 mt-10">
    
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h2 class="text-xl font-extrabold tracking-tight text-slate-900">Persetujuan Berkas Masuk</h2>
        <p class="text-xs text-slate-500 font-medium">Tinjau vendor rekanan dan nominal harga sebelum memberikan validasi tanda tangan digital.</p>
      </div>
      <div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-2.5 flex items-center gap-3 shadow-sm">
        <span class="text-xs font-bold text-indigo-800">Total Butuh Approval:</span>
        <span id="badge-counter-manajer" class="bg-indigo-600 text-white px-2.5 py-0.5 rounded-md text-xs font-black">0</span>
      </div>
    </div>

    <div class="space-y-4" id="kontenCardsManajer">
      </div>

  </main>

  <script>
    const URL_API = "https://bgtgeltkbanlnvymalum.supabase.co/rest/v1/purchase_request";
    const KEY_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE";
    const HEADERS_APP = { "apikey": KEY_TOKEN, "Authorization": `Bearer ${KEY_TOKEN}`, "Content-Type": "application/json" };

    async function loadDataManajer() {
      const container = document.getElementById('kontenCardsManajer');
      if(!container) return;
      container.innerHTML = `<div class="text-center p-8 text-xs font-bold text-slate-400">⏳ Sedang memetakan berkas...</div>`;

      try {
        const res = await fetch(`${URL_API}?order=created_at.desc`, { method: "GET", headers: HEADERS_APP });
        const data = await res.json();
        
        // Filter berkas yang statusnya sedang 'diproses' (Menunggu Meja Manajer)
        const antreanManajer = data.filter(i => i.status === 'diproses');
        
        // Update total counter angka di kanan atas
        document.getElementById('badge-counter-manajer').innerText = antreanManajer.length;

        container.innerHTML = "";

        if(antreanManajer.length === 0) {
          container.innerHTML = `
            <div class="bg-white rounded-2xl border border-slate-200/80 p-16 text-center text-slate-400 text-xs custom-shadow">
               ☕ Bersih! Tidak ada berkas baru yang memerlukan persetujuan Anda saat ini.
            </div>`;
          return;
        }

        antreanManajer.forEach(item => {
          const namaVendor = item.supplier_terpilih || 'Belum Ditentukan Staf';
          const totalHarga = Number(item.harga_vendor) || 0;
          const shortId = item.id ? item.id.substring(0,6) : '0000';

          container.innerHTML += `
            <div class="bg-white border border-slate-200 rounded-2xl custom-shadow flex flex-col md:flex-row md:items-center justify-between gap-6 card-glow transition-all duration-300 relative overflow-hidden p-6 pl-8">
              <div class="absolute top-0 left-0 w-2 h-full bg-indigo-500"></div>
              
              <div class="flex-1">
                <div class="flex items-center gap-3 mb-3">
                  <h4 class="text-base font-extrabold text-slate-800 capitalize tracking-tight">${item.nama_barang || 'Item Kosong'}</h4>
                  <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 border rounded-md bg-indigo-50 text-indigo-700 border-indigo-100">Menunggu Verifikasi Anda</span>
                </div>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-y-2 gap-x-4 text-xs font-medium text-slate-500">
                  <div>Kuantitas: <span class="text-slate-800 font-bold">${item.jumlah || 1} Unit</span></div>
                  <div class="col-span-1">Rekomendasi Vendor: <span class="text-blue-600 font-extrabold">${namaVendor}</span></div>
                  <div>Nominal Ajuan: <span class="text-emerald-600 font-black text-sm">${totalHarga > 0 ? 'Rp ' + totalHarga.toLocaleString('id-ID') : 'Rp 0'}</span></div>
                  <div class="text-[10px] font-mono text-slate-400">ID Berkas: #PR-${shortId}</div>
                </div>
              </div>
              
              <div class="flex items-center gap-2 self-end md:self-auto border-t md:border-t-0 pt-3 md:pt-0 w-full md:w-auto justify-end">
                <button onclick="eksekusiApproval('${item.id}', 'disetujui')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold px-5 py-2.5 rounded-xl transition shadow-sm flex items-center gap-1">
                  👍 Setujui Anggaran
                </button>
                <button onclick="eksekusiApproval('${item.id}', 'diverifikasi')" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-bold px-4 py-2.5 rounded-xl transition">
                  🛑 Tolak Berkas
                </button>
              </div>
            </div>
          `;
        });

      } catch (e) {
        console.error("Gagal memuat dashboard manajer:", e);
        container.innerHTML = `<div class="text-center p-8 text-xs font-bold text-red-500">❌ Gagal terhubung ke server database Supabase.</div>`;
      }
    }

    async function eksekusiApproval(id, statusBaru) {
      const kataAksi = statusBaru === 'disetujui' ? 'MENYETUJUI anggaran' : 'MENOLAK berkas';
      if(!confirm(`Apakah Anda yakin ingin ${kataAksi} untuk pengadaan berkas ini?`)) return;

      try {
        const res = await fetch(`${URL_API}?id=eq.${id}`, {
          method: "PATCH",
          headers: HEADERS_APP,
          body: JSON.stringify({ status: statusBaru })
        });
        
        if(res.ok) {
          alert(`Sukses! Berkas berhasil diperbarui.`);
          loadDataManajer(); // Refresh list secara realtime
        } else {
          alert(`Gagal merespons berkas ke server.`);
        }
      } catch(e) { 
        console.error(e); 
        alert(`Terjadi kesalahan jaringan.`);
      }
    }

    // Load data otomatis saat pertama kali halaman manajer terbuka
    window.onload = loadDataManajer;
  </script>
</body>
</html>
