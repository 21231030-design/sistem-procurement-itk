<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Staf Keuangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <nav class="bg-orange-600 text-white px-6 py-4 flex justify-between items-center shadow">
    <h1 class="font-bold text-lg">Dashboard Staf Keuangan</h1>
    <button onclick="logout()" class="bg-white text-orange-600 px-4 py-1 rounded-lg text-sm font-semibold">Logout</button>
  </nav>

  <div class="max-w-4xl mx-auto mt-8 px-4">

    <!-- Ringkasan -->
    <div class="grid grid-cols-2 gap-4 mb-6">
      <div class="bg-blue-100 rounded-xl p-4 text-center">
        <p class="text-2xl font-bold text-blue-700" id="jmlPO">-</p>
        <p class="text-sm text-blue-600">Total PO</p>
      </div>
      <div class="bg-green-100 rounded-xl p-4 text-center">
        <p class="text-2xl font-bold text-green-700" id="jmlLunas">-</p>
        <p class="text-sm text-green-600">Invoice Lunas</p>
      </div>
    </div>

    <!-- Daftar PO untuk diverifikasi -->
    <div class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-700 mb-4">Purchase Order — Verifikasi Pembayaran</h2>
      <div id="listPO"><p class="text-gray-400 text-sm">Memuat data...</p></div>
    </div>

    <!-- Riwayat Invoice -->
    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-bold text-gray-700 mb-4">Riwayat Invoice</h2>
      <div id="listInvoice"><p class="text-gray-400 text-sm">Memuat data...</p></div>
    </div>
  </div>

  <script>
    const { createClient } = supabase
    const sb = createClient('https://bgtgeltkbanlnvymalum.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE')

    async function cekLogin() {
      const { data } = await sb.auth.getSession()
      if (!data.session) { window.location.href = 'index.html'; return }
      muatPO()
      muatInvoice()
    }

    async function muatPO() {
      const { data } = await sb.from('purchase_order').select('*')
        .order('created_at', { ascending: false })

      document.getElementById('jmlPO').textContent = data ? data.length : 0

      const container = document.getElementById('listPO')
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-sm">Belum ada PO.</p>'
        return
      }

      container.innerHTML = data.map(po => `
        <div class="border rounded-lg p-4 mb-3">
          <div class="flex justify-between items-start mb-2">
            <div>
              <p class="font-semibold text-gray-700">${po.nama_supplier}</p>
              <p class="text-sm text-gray-500">Total: Rp ${parseInt(po.total_harga).toLocaleString('id-ID')}</p>
              <p class="text-sm text-gray-500">Tgl Kirim: ${po.tgl_kirim}</p>
              <p class="text-xs text-gray-400">Status PO: ${po.status.toUpperCase()}</p>
            </div>
          </div>
          <button onclick="buatInvoice('${po.id}', ${po.total_harga}, '${po.nama_supplier}')"
            class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">
            + Buat Invoice
          </button>
        </div>
      `).join('')
    }

    async function muatInvoice() {
      const { data } = await sb.from('invoice').select('*')
        .order('created_at', { ascending: false })

      document.getElementById('jmlLunas').textContent = data
        ? data.filter(x => x.status_bayar === 'lunas').length : 0

      const container = document.getElementById('listInvoice')
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-sm">Belum ada invoice.</p>'
        return
      }

      container.innerHTML = data.map(inv => `
        <div class="border rounded-lg p-4 mb-3 flex justify-between items-center">
          <div>
            <p class="font-semibold text-gray-700">${inv.nama_supplier}</p>
            <p class="text-sm text-gray-500">Tagihan: Rp ${parseInt(inv.jumlah_tagihan).toLocaleString('id-ID')}</p>
            <p class="text-xs text-gray-400">${new Date(inv.created_at).toLocaleDateString('id-ID')}</p>
          </div>
          <div class="flex flex-col items-end gap-2">
            <span class="text-xs font-bold px-3 py-1 rounded-full ${inv.status_bayar === 'lunas' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
              ${inv.status_bayar.toUpperCase()}
            </span>
            ${inv.status_bayar !== 'lunas' ? `
              <button onclick="bayarInvoice('${inv.id}')"
                class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-xs font-semibold">
                Tandai Lunas
              </button>` : ''}
          </div>
        </div>
      `).join('')
    }

    async function buatInvoice(poId, totalHarga, namaSupplier) {
      const { error } = await sb.from('invoice').insert({
        po_id: poId, jumlah_tagihan: totalHarga,
        nama_supplier: namaSupplier, status_bayar: 'belum_lunas'
      })
      if (!error) {
        alert('Invoice berhasil dibuat!')
        muatInvoice()
      }
    }

    async function bayarInvoice(id) {
      const { error } = await sb.from('invoice').update({ status_bayar: 'lunas' }).eq('id', id)
      if (!error) muatInvoice()
    }

    async function logout() {
      await sb.auth.signOut()
      window.location.href = 'index.html'
    }

    cekLogin()
  </script>
</body>
</html>
