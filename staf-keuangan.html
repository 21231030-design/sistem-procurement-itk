<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengadaan - Staf Keuangan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-[#1b4332] text-white px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <div class="bg-white/10 p-2 rounded-lg">
                <i class="fa-solid fa-dollar-sign text-xl text-emerald-400"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Sistem Pengadaan</h1>
                <p class="text-xs text-gray-300">Dashboard Staf Keuangan</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="bg-white/10 px-4 py-2 rounded-full text-sm flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                staf.keuangan@itk.ac.id
            </div>
            <button class="bg-red-700 hover:bg-red-800 px-4 py-2 rounded-lg text-sm font-medium transition shadow">
                Keluar
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-6">

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center">
                <span class="text-2xl font-black text-gray-400 block">0</span>
                <span class="text-xs text-gray-500 font-medium">Perlu Matching</span>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center">
                <span class="text-2xl font-black text-gray-400 block">0</span>
                <span class="text-xs text-gray-500 font-medium">Terbitkan Voucher</span>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center">
                <span class="text-2xl font-black text-gray-400 block">0</span>
                <span class="text-xs text-gray-500 font-medium">Proses Bayar</span>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center bg-emerald-50/50 border-emerald-200">
                <span class="text-2xl font-black text-emerald-600 block">1</span>
                <span class="text-xs text-emerald-600 font-semibold">Selesai</span>
            </div>
        </div>

        <div class="flex flex-wrap gap-2 border-b border-gray-200 pb-2">
            <button class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700">3-Way Matching <span class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full ml-1">0</span></button>
            <button class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700">Voucher Pembayaran <span class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full ml-1">0</span></button>
            <button class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700">Proses Bayar <span class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full ml-1">0</span></button>
            <button class="px-4 py-2 text-sm font-semibold bg-[#1b4332] text-white rounded-lg shadow">Selesai</button>
        </div>

        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="p-4 bg-emerald-50 border-b border-emerald-100 flex items-start gap-3">
                <div class="bg-emerald-500 text-white p-2 rounded-lg mt-0.5">
                    <i class="fa-solid fa-square-check"></i>
                </div>
                <div>
                    <h2 class="font-bold text-gray-800 text-sm">PR Selesai</h2>
                    <p class="text-xs text-gray-500">Seluruh proses pengadaan sudah tuntas.</p>
                </div>
            </div>

            <div class="p-5">
                <div class="p-4 border border-gray-200 rounded-xl bg-gray-50/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div class="space-y-1">
                        <h3 class="font-bold text-gray-850 text-base">laptop dell</h3>
                        <p class="text-xs text-gray-500">5 unit &bull; Selesai 01 Jun 2026</p>
                        
                        <div class="pt-2">
                            <a href="https://bgtgeltkbanlnvymalum.supabase.co/storage/v1/object/public/invoices/invoice-laptop-dell.pdf" 
                               target="_blank" 
                               class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow transition">
                                <i class="fa-solid fa-file-invoice"></i> Lihat File Invoice
                            </a>
                        </div>
                    </div>
                    <div>
                        <span class="bg-emerald-100 text-emerald-800 font-bold text-xs px-3 py-1 rounded-full border border-emerald-200 flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-600"></span> Selesai
                        </span>
                    </div>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
