<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Staf Pengadaan - ITK Procurement</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #f0f4f8; color: #1e293b; }
    nav { background: #0f2847; padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; color: white; }
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: white; border-radius: 12px; padding: 1.5rem; border: 1px solid #e2e8f0; margin-bottom: 2rem; }
    h3 { margin-bottom: 1rem; color: #0f2847; }
    .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 4px; }
    input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .btn { background: #0f2847; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .btn-success { background: #10b981; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th { background: #f8fafc; color: #64748b; font-size: 11px; text-transform: uppercase; padding: 12px; text-align: left; border-bottom: 2px solid #e2e8f0; }
    td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #e2e8f0; }
  </style>
</head>
<body>

<nav>
  <h2>Sistem Pengadaan ITK — Staf Pengadaan</h2>
  <button class="btn" style="background:rgba(255,255,255,0.1);" onclick="window.location.href='index.html'">Keluar</button>
</nav>

<div class="container">
  <div class="card">
    <h3>Buat Permintaan Barang Baru (PR)</h3>
    <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; align-items: end;">
      <div class="form-group">
        <label>Nama Barang / Item</label>
        <input type="text" id="namaBarang" placeholder="Contoh: Busi Motor">
      </div>
      <div class="form-group">
        <label>Jumlah (Qty)</label>
        <input type="number" id="jumlahBarang" value="1" min="1">
      </div>
      <div class="form-group">
        <label>Harga Satuan (Estimasi)</label>
        <input type="number" id="hargaEstimasi" placeholder="Contoh: 40000">
      </div>
      <button class="btn" onclick="simpanPRBaru()" style="height: 40px;">➕ Ajukan PR</button>
    </div>
  </div>

  <div class="card">
    <h3>Daftar Permintaan Pengadaan (PR Log)</h3>
    <table>
      <thead>
        <tr>
          <th>ID PR</th>
          <th>Nama Barang</th>
          <th>Jumlah</th>
          <th>Harga Satuan</th>
          <th>Total Estimasi</th>
          <th>Status Alur</th>
          <th>Aksi Finansial</th>
        </tr>
      </thead>
      <tbody id="tabelPR"></tbody>
    </table>
  </div>
</div>

<script>
  const SB_URL = "https://bgtgeltkbanlnvymalum.supabase.co";
  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE";
  const sb = supabase.createClient(SB_URL, SB_KEY);

  async function muatTabelPengadaan() {
    const { data: prs } = await sb.from('purchase_request').select('*').order('created_at', { ascending: false });
    const tbody = document.getElementById('tabelPR');
    tbody.innerHTML = "";

    if(!prs || prs.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#64748b;">Belum ada data permintaan barang.</td></tr>`;
      return;
    }

    prs.forEach(pr => {
      const qty = Number(pr.jumlah) || 0;
      const satuan = Number(pr.harga_estimasi) || 0;
      const total = qty * satuan;

      let tombolAksi = "";
      if(pr.status === "pending" || !pr.status) {
        tombolAksi = `<button class="btn btn-success" style="padding:5px 10px; font-size:12px;" onclick="prosesKePO('${pr.id}')">⚡ Kirim Dokumen</button>`;
      } else {
        tombolAksi = `<span style="color:#64748b; font-size:12px;">Diteruskan</span>`;
      }

      tbody.innerHTML += `
        <tr>
          <td>#${pr.id.substring(0,5)}</td>
          <td><b>${pr.nama_barang || '—'}</b></td>
          <td>${qty} Unit</td>
          <td>Rp ${satuan.toLocaleString('id-ID')}</td>
          <td><b>Rp ${total.toLocaleString('id-ID')}</b></td>
          <td><span class="badge">${pr.status || 'pending'}</span></td>
          <td>${tombolAksi}</td>
        </tr>
      `;
    });
  }

  async function simpanPRBaru() {
    const nama = document.getElementById('namaBarang').value.trim();
    const qty = parseInt(document.getElementById('jumlahBarang').value) || 1;
    const harga = parseFloat(document.getElementById('hargaEstimasi').value) || 0;

    if(!nama || harga <= 0) {
      alert("Isi nama barang dan harga estimasi satuan dengan benar!");
      return;
    }

    await sb.from('purchase_request').insert([{
      nama_barang: nama,
      jumlah: qty,
      harga_estimasi: harga,
      status: 'pending'
    }]);

    alert("PR Baru berhasil tersimpan di database!");
    document.getElementById('namaBarang').value = "";
    document.getElementById('jumlahBarang').value = "1";
    document.getElementById('hargaEstimasi').value = "";
    muatTabelPengadaan();
  }

  async function prosesKePO(prId) {
    const { data: pr } = await sb.from('purchase_request').select('*').eq('id', prId).single();
    if (!pr) return;

    const qty = Number(pr.jumlah) || 1;
    const hargaSatuan = Number(pr.harga_estimasi) || 0;
    const totalHargaMurni = hargaSatuan * qty; 

    const noPOAcak = `PO/ITK/${Math.floor(1000 + Math.random() * 9000)}`;

    // Insert ke purchase_order
    await sb.from('purchase_order').insert([
      { pr_id: prId, no_po: noPOAcak, total_harga: totalHargaMurni }
    ]);

    // Update status di purchase_request menjadi 'disetujui' biar dibaca Manajer
    await sb.from('purchase_request').update({ status: 'disetujui' }).eq('id', prId);

    alert(`Sukses! Berkas terkirim secara realtime ke Manajer dengan Total Rp ${totalHargaMurni.toLocaleString('id-ID')}`);
    muatTabelPengadaan();
  }

  window.onload = muatTabelPengadaan;
</script>
</body>
</html>
