<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengadaan - Dashboard Staf Keuangan</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            color: #1f2937;
        }
        nav {
            background-color: #14532d;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-logo-box {
            background-color: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 20px;
        }
        .nav-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-badge {
            background-color: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
        }
        .btn-keluar {
            background-color: #1c3d26;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-cols: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stats-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }
        .stats-num {
            font-size: 24px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .stats-card.active {
            background-color: #f0fdf4;
            border-color: #bbf7d0;
        }
        .tabs-container {
            display: flex;
            gap: 10px;
            border-b: 1px solid #e5e7eb;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .tab-btn {
            background: white;
            border: 1px solid #e5e7eb;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #4b5563;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn.active {
            background-color: #14532d;
            color: white;
            font-weight: bold;
        }
        .badge-count {
            background-color: #ef4444;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
        }
        .main-box {
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }
        .box-header {
            background-color: #f0fdf4;
            border-bottom: 1px solid #e6f4ea;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-icon {
            background-color: #dcfce7;
            color: #15803d;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .box-content {
            padding: 25px;
        }
        .item-row {
            padding: 20px;
            border: 1px solid #f3f4f6;
            border-radius: 12px;
            background-color: #f9fafb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 6px 0;
        }
        .item-details {
            font-size: 13px;
            color: #6b7280;
            margin: 0;
        }
        .status-badge {
            background-color: #dcfce7;
            color: #15803d;
            font-weight: bold;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #bbf7d0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #16a34a;
            border-radius: 50%;
        }
        /* Style Tombol Form */
        .action-container {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-action {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
        }
        .btn-upload {
            background-color: #2563eb;
            color: white;
        }
        .btn-view {
            background-color: #16a34a;
            color: white;
        }
        .status-text {
            font-size: 13px;
            color: #4b5563;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <nav>
        <div class="nav-logo">
            <div class="nav-logo-box">$</div>
            <div>
                <div style="font-weight: bold; font-size: 16px;">Sistem Pengadaan</div>
                <div style="font-size: 12px; color: #cbd5e1;">Dashboard Staf Keuangan</div>
            </div>
        </div>
        <div class="nav-user">
            <div class="user-badge">
                <span class="badge-dot"></span>
                staf.keuangan@itk.ac.id
            </div>
            <button class="btn-keluar">Keluar</button>
        </div>
    </nav>

    <main>
        <div class="stats-grid">
            <div class="stats-card"><span class="stats-num" style="color: #c2410c;">0</span><span style="font-size: 12px; color: #6b7280;">Perlu Matching</span></div>
            <div class="stats-card"><span class="stats-num" style="color: #701a75;">0</span><span style="font-size: 12px; color: #6b7280;">Terbitkan Voucher</span></div>
            <div class="stats-card"><span class="stats-num" style="color: #1d4ed8;">0</span><span style="font-size: 12px; color: #6b7280;">Proses Bayar</span></div>
            <div class="stats-card active"><span class="stats-num" style="color: #15803d;">1</span><span style="font-size: 12px; color: #15803d; font-weight: bold;">Selesai</span></div>
        </div>

        <div class="tabs-container">
            <button class="tab-btn">3-Way Matching <span class="badge-count">0</span></button>
            <button class="tab-btn">Voucher Pembayaran <span class="badge-count">0</span></button>
            <button class="tab-btn">Proses Bayar <span class="badge-count">0</span></button>
            <button class="tab-btn active">Selesai</button>
        </div>

        <div class="main-box">
            <div class="box-header">
                <div class="header-icon">✓</div>
                <div>
                    <div style="font-weight: bold; font-size: 14px;">PR Selesai</div>
                    <div style="font-size: 12px; color: #6b7280;">Seluruh proses pengadaan sudah tuntas.</div>
                </div>
            </div>

            <div class="box-content">
                <div class="item-row">
                    <div>
                        <h3 class="item-title">laptop dell</h3>
                        <p class="item-details">5 unit • Selesai 01 Jun 2026</p>
                        
                        <div class="action-container">
                            <input type="file" id="file-invoice" accept="image/*,application/pdf" style="display: none;" onchange="unggahKeSupabase()">
                            
                            <button id="btn-pilih" class="btn-action btn-upload" onclick="memicuPilihFile()">
                                📁 Upload Invoice Baru
                            </button>
                            
                            <a id="btn-lihat" class="btn-action btn-view" href="#" target="_blank" style="display: none;">
                                📄 Lihat Invoice
                            </a>
                            
                            <span id="text-status" class="status-text">Memeriksa file...</span>
                        </div>
                    </div>
                    <div>
                        <div class="status-badge">
                            <span class="status-dot"></span> Selesai
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Konfigurasi Kunci API Supabase Anda
        const SUPABASE_URL = 'https://bgtgeltkbanlnvymalum.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTcyMjQ1NDMsImV4cCI6MjAzMjc5OTU0M30.4E_jX1H2m3Y9iX5Z8_8Z-Y-9Y_8Z-Y-9Y_8Z-Y-9Y_8';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function memicuPilihFile() {
            document.getElementById('file-invoice').click();
        }

        // Fungsi cek apakah sudah ada file invoice di Supabase
        async function cekFileInvoice() {
            const statusLabel = document.getElementById('text-status');
            const tombolLihat = document.getElementById('btn-lihat');

            try {
                const { data, error } = await supabaseClient.storage.from('invoices').list('', { limit: 1 });
                
                if (error) throw error;

                if (data && data.length > 0) {
                    const namaFile = data[0].name;
                    statusLabel.innerText = "File tersedia: " + namaFile;
                    tombolLihat.href = `${SUPABASE_URL}/storage/v1/object/public/invoices/${namaFile}`;
                    tombolLihat.style.display = "inline-flex";
                } else {
                    statusLabel.innerText = "Belum ada file invoice.";
                    tombolLihat.style.display = "none";
                }
            } catch (e) {
                statusLabel.innerText = "Gagal memuat status storage.";
            }
        }

        // Fungsi mengunggah file langsung dari web ke Supabase Storage
        async function unggahKeSupabase() {
            const inputKanal = document.getElementById('file-invoice');
            const statusLabel = document.getElementById('text-status');
            
            if (!inputKanal.files || inputKanal.files.length === 0) return;
            
            const fileDarah = inputKanal.files[0];
            statusLabel.innerText = "Sedang mengupload...";

            // Membuat nama file bersih otomatis
            const ekstensi = fileDarah.name.split('.').pop();
            const namaFileBaru = `invoice-laptop-dell.${ekstensi}`;

            try {
                const { data, error } = await supabaseClient.storage
                    .from('invoices')
                    .upload(namaFileBaru, fileDarah, { upsert: true });

                if (error) throw error;

                statusLabel.innerText = "Berhasil diupload!";
                cekFileInvoice(); // Segarkan tampilan tombol lihat
            } catch (err) {
                statusLabel.innerText = "Gagal upload: " + err.message;
            }
        }

        // Jalankan cek file otomatis saat web dimuat
        document.addEventListener('DOMContentLoaded', cekFileInvoice);
    </script>
</body>
</html>
