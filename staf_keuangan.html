<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Keuangan — Verifikasi 3-Way Matching ITK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; } </style>
</head>
<body class="text-slate-800 pb-24">

  <header class="bg-[#0f172a] text-white px-10 h-[80px] flex items-center justify-between shadow-md">
    <div class="flex items-center gap-4">
      <div class="bg-emerald-500 w-10 h-10 rounded-xl flex items-center justify-center text-xl font-bold">🎯</div>
      <div>
        <h1 class="text-lg font-extrabold block leading-tight">ITK Finance Audit Core</h1>
        <p class="text-[11px] text-emerald-400 font-medium">Verifikasi Pembayaran Berdasarkan Real-Time Harga Pengadaan</p>
      </div>
    </div>
    <button onclick="location.href='index.html'" class="bg-white/5 hover:bg-red-500 px-4 py-2 rounded-xl text-xs font-bold transition">Keluar</button>
  </header>

  <main class="max-w-7xl mx-auto px-8 mt-10">
    <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm mb-8 flex gap-2">
      <button onclick="setTabKeuangan('perlu_dibayar')" id="f-tab-perlu" class="px-5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2">⏳ Perlu Audit Pembayaran <span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-md text-[10px]" id="f-badge-perlu">0</span></button>
      <button onclick="setTabKeuangan('telah_lunas')" id="f-tab-lunas" class="px-5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2">✅ Record Pembayaran Lunas <span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md text-[10px]" id="f-badge-lunas">0</span></button>
    </div>

    <div class="space-y-4">
      <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-400 px-2">Manifest Kendali Keuangan Kampus</h3>
      <div class="flex flex-col gap-4" id="containerKeuangan"></div>
    </div>
  </main>

  <script>
    const { createClient } = supabase;
    // Menggunakan kredensial database Supabase asli milik Anda
    const sb = createClient(
      'https://bgtgeltkbanlnvymalum.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE'
    );

    let currentTabKeuangan = 'perlu_dibayar';

    async function AmbilDataKeuangan() {
      try {
        const { data, error } = await sb.from('purchase_request').select('*').order('created_at', { ascending: false });
        if (error) throw error;

        // PERBAIKAN LOGIKA FILTER: Yang belum lunas masuk ke tab 'perlu_dibayar' tanpa memandang status teksnya apa
        const perluBayar = data.filter(i => i.status !== 'lunas').length;
        const telahLunas = data.filter(i => i.status === 'lunas').length;

        document.getElementById('f-badge-perlu').innerText = perluBayar;
        document.getElementById('f-badge-lunas').innerText = telahLunas;

        TampilkanDaftarKeuangan(data);
      } catch (e) { console.error("Gagal mengambil data database:", e); }
    }

    function setTabKeuangan(tabBaru) {
      currentTabKeuangan = tabBaru;
      document.getElementById('f-tab-perlu').className = "px-5 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100";
      document.getElementById('f-tab-lunas').className = "px-5 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100";
      
      if(currentTabKeuangan === 'perlu_dibayar') {
        document.getElementById('f-tab-perlu').className = "px-5 py-2.5 rounded-xl text-xs font-bold bg-amber-500 text-white shadow-sm";
      } else {
        document.getElementById('f-tab-lunas').className = "px-5 py-2.5 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-sm";
      }
      AmbilDataKeuangan();
    }

    function TampilkanDaftarKeuangan(allData) {
      const container = document.getElementById('containerKeuangan');
      container.innerHTML = "";

      // Memisahkan data berdasarkan tab aktif
      const filtered = allData.filter(item => {
        return currentTabKeuangan === 'perlu_dibayar' ? item.status !== 'lunas' : item.status === 'lunas';
      });

      if(filtered.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-12 text-center text-slate-400 text-xs shadow-sm">✨ Belum ada data manifest penagihan pada kategori ini.</div>`;
        return;
      }

      filtered.forEach(item => {
        const itemFix = item.nama_barang || 'Material Logistik';
        const vendorFix = item.supplier_terpilih || item.supplier || "PT. Mitra Rekanan ITK";
        
        // MENGAMBIL HARGA ASLI SECARA REAL-TIME DARI DATA PENGADAAN (TANPA MERUSAK STRUKTUR)
        const hargaFix = Number(item.harga) || Number(item.harga_supplier) || 0;
        const shortId = item.id ? String(item.id).substring(0,6) : '0000';

        // Parsing No Surat Jalan dan No Invoice yang diinput supplier
        let nomorSJ = "Menunggu Input Supplier...";
        let nomorInv = "Menunggu Input Supplier...";
        if (item.catatan_penerimaan && item.catatan_penerimaan.includes("SJ:")) {
          const part = item.catatan_penerimaan.split(" | ");
          nomorSJ = part[0].replace("[VENDOR] SJ: ", "");
          if(part[1]) nomorInv = part[1].replace("INV: ", "");
        }

        let aksiTombol = "";
        if (currentTabKeuangan === 'perlu_dibayar') {
          aksiTombol = `
            <button onclick="GenerateInvoice3WayPDF('${itemFix}', '${vendorFix}', '${nomorInv}', '${nomorSJ}', ${hargaFix}, ${item.jumlah || 1}, '${shortId}', 'UNPAID')" class="bg-purple-700 hover:bg-purple-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-sm">
              📄 Lihat PDF Invoice (3-Way Audit)
            </button>
            <button onclick="ProsesBayarLunas('${item.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-sm">
              💰 Transfer &amp; Lunaskan
            </button>`;
        } else {
          aksiTombol = `
            <button onclick="GenerateInvoice3WayPDF('${itemFix}', '${vendorFix}', '${nomorInv}', '${nomorSJ}', ${hargaFix}, ${item.jumlah || 1}, '${shortId}', 'PAID', '${item.link_bukti_lunas || 'TRF-BANK/ITK'}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-sm">
              🖨️ Cetak PDF Invoice (PAID)
            </button>`;
        }

        container.innerHTML += `
          <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm border-l-4 ${currentTabKeuangan === 'perlu_dibayar' ? 'border-l-amber-500':'border-l-emerald-500'}">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
              <div class="flex-1">
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-[10px] font-mono text-slate-400 mb-2 uppercase tracking-wider font-bold">
                  🗂️ INSTRUMEN AUDIT KELEMBAGAAN: [1. PO: #PO-${shortId}] → [2. Surat Jalan: ${nomorSJ}] → [3. No Invoice: ${nomorInv}]
                </div>
                <h4 class="text-base font-extrabold text-slate-800 capitalize mb-1">${itemFix}</h4>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-2 text-xs font-semibold text-slate-500">
                  <div>Vendor: <span class="text-slate-800 font-bold">${vendorFix}</span></div>
                  <div>Nilai Pembayaran (Real-Time): <span class="text-emerald-600 font-black">Rp ${hargaFix.toLocaleString('id-ID')}</span></div>
                  <div>Kuantitas: <span class="text-purple-700">${item.jumlah || 1} Unit</span></div>
                </div>
              </div>
              <div class="flex items-center gap-2 justify-end">${aksiTombol}</div>
            </div>
          </div>`;
      });
    }

    function GenerateInvoice3WayPDF(barang, vendor, inv, sj, total, qty, poId, statusBayar, refBank = "") {
      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <html>
        <head>
          <title>ITK Official Invoice — 3-Way Matching Document</title>
          <script src="https://cdn.tailwindcss.com"><\/script>
        </head>
        <body class="p-12 text-slate-800 bg-white">
          <div class="border-2 border-slate-800 p-8 rounded-xl relative">
            
            <div class="absolute top-6 right-6 border-4 ${statusBayar === 'PAID' ? 'border-emerald-600 text-emerald-600' : 'border-amber-500 text-amber-500'} px-6 py-2 rounded-lg font-black text-xl tracking-widest uppercase rotate-12">
              ${statusBayar}
            </div>

            <div class="border-b-4 border-slate-800 pb-6 mb-6 flex justify-between items-center">
              <div>
                <h1 class="text-3xl font-black tracking-tight text-slate-900">${vendor}</h1>
                <p class="text-xs text-slate-500 font-semibold mt-1">Mitra Penyedia Eksternal Logistik ITK</p>
              </div>
              <div class="text-right">
                <h2 class="text-xl font-bold text-slate-400">FAKTUR / INVOICE PENAGIHAN</h2>
                <p class="text-xs font-mono font-bold mt-1 text-purple-700">Ref: ${inv}</p>
              </div>
            </div>

            <div class="bg-slate-100 p-4 rounded-xl border border-slate-300 mb-6">
              <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">📋 Hasil Validasi Komparasi (3-Way Matching Audit)</div>
              <div class="grid grid-cols-3 gap-4 text-xs font-bold text-slate-700">
                <div class="bg-white p-2 rounded border border-slate-200">1. Ref PO: <span class="text-blue-600 font-mono">#ITK-PO-${poId}</span> <span class="text-emerald-600">✓</span></div>
                <div class="bg-white p-2 rounded border border-slate-200">2. No. Surat Jalan: <span class="text-purple-600 font-mono">${sj}</span> <span class="text-emerald-600">✓</span></div>
                <div class="bg-white p-2 rounded border border-slate-200">3. No. Invoice: <span class="text-amber-600 font-mono">${inv}</span> <span class="text-emerald-600">✓</span></div>
              </div>
            </div>

            <table class="w-full text-left text-xs mb-6 border-collapse border border-slate-300">
              <thead>
                <tr class="bg-slate-800 text-white">
                  <th class="p-3 border border-slate-300">Deskripsi Pengadaan Barang/Jasa</th>
                  <th class="p-3 border border-slate-300 text-center">Volume</th>
                  <th class="p-3 border border-slate-300 text-right">Total Nilai Tagihan (Sesuai Pengadaan)</th>
                </tr>
              </thead>
              <tbody>
                <tr class="font-semibold text-slate-700">
                  <td class="p-3 border border-slate-300 capitalize font-bold text-slate-900">${barang}</td>
                  <td class="p-3 border border-slate-300 text-center">${qty} Unit/Pcs</td>
                  <td class="p-3 border border-slate-300 text-right text-emerald-600 font-black text-sm">Rp ${total.toLocaleString('id-ID')}</td>
                </tr>
              </tbody>
            </table>

            \${statusBayar === 'PAID' ? \`
            <div class="mt-6 p-4 bg-emerald-50 border border-emerald-300 rounded-xl text-center text-xs font-bold text-emerald-800">
              💰 DANA TELAH DICAIRKAN / TRANSFER BERHASIL <br>
              <span class="font-mono text-xs text-slate-600">No. Referensi Bank Keuangan ITK: \${refBank}</span>
            </div>\` : ''}

          </div>
          <script>window.onload = function() { window.print(); }<\/script>
        </body>
        </html>
      `);
      printWindow.document.close();
    }

    async function ProsesBayarLunas(id) {
      const refBankInput = prompt("Konfirmasi Transfer Sukses! Masukkan Nomor Referensi Bank Keuangan ITK:", "TRF-BANK/ITK/" + Math.floor(100000 + Math.random() * 900000));
      if (!refBankInput) return;

      try {
        const { error } = await sb.from('purchase_request').update({
          status: 'lunas', 
          link_bukti_lunas: refBankInput
        }).eq('id', id);

        if (error) throw error;
        alert("Sukses! 3-Way Matching Terverifikasi, Status Berubah Menjadi Lunas.");
        setTabKeuangan('perlu_dibayar');
      } catch (e) { alert("Gagal memperbarui status: " + e.message); }
    }

    window.onload = () => setTabKeuangan('perlu_dibayar');
  </script>
</body>
</html>
