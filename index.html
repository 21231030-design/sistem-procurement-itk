<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Procurement ITK — Login Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f2847; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .login-container { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 420px; text-align: center; }
    .logo-area { font-size: 24px; font-weight: 700; color: #0f2847; margin-bottom: 5px; }
    .logo-sub { font-size: 13px; color: #64748b; margin-bottom: 2rem; }
    .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; margin-bottom: 1.2rem; }
    .form-group label { font-size: 13px; font-weight: 600; color: #475569; }
    input { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; width: 100%; outline: none; }
    input:focus { border-color: #2563eb; }
    .btn-group { display: flex; gap: 10px; margin-top: 1.5rem; }
    .btn { flex: 1; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-login { background: #2563eb; color: white; }
    .btn-register { background: #10b981; color: white; }
  </style>
</head>
<body>
<div class="login-container">
  <div class="logo-area">Sistem Procurement</div>
  <div class="logo-sub">Perancangan Sistem Informasi Logistik</div>
  <div class="form-group">
    <label>Email Pengguna</label>
    <input type="email" id="email" placeholder="staf.pengadaan@itk.ac.id">
  </div>
  <div class="form-group">
    <label>Kata Sandi</label>
    <input type="password" id="password" value="123456" placeholder="••••••••">
  </div>
  <div class="btn-group">
    <button class="btn btn-login" onclick="aksiLogin()">Masuk</button>
  </div>
</div>
<script>
  function aksiLogin() {
    const email = document.getElementById('email').value.trim();
    // Deteksi otomatis apakah sedang dibuka via HTMLPreview atau Vercel
    const currentUrl = window.location.href;
    let baseUrl = "";
    
    if (currentUrl.includes("htmlpreview.github.io")) {
      baseUrl = "https://htmlpreview.github.io/?https://github.com/21231030-design/sistem-procurement-itk/blob/main/";
    } else {
      baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1);
    }

    if(email === "staf.pengadaan@itk.ac.id") {
      window.location.href = baseUrl + "staf_pengadaan.html"; 
    } else if(email === "supplier@itk.ac.id") {
      window.location.href = baseUrl + "supplier.html";
    } else {
      alert("Gunakan email: staf.pengadaan@itk.ac.id atau supplier@itk.ac.id");
    }
  }
</script>
</body>
</html>
