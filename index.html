<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/Register - Sistem Procurement ITK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-blue-700 to-blue-900 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-2xl p-10 w-full max-w-md">
    <div class="text-center mb-8">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/ITK_Logo.png/200px-ITK_Logo.png" 
           class="w-20 mx-auto mb-3">
      <h1 class="text-2xl font-bold text-blue-700">Sistem Procurement</h1>
      <p class="text-gray-500 text-sm">Institut Teknologi Kalimantan</p>
    </div>

    <!-- FORM EMAIL & PASSWORD -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input id="email" type="email" placeholder="email@itk.ac.id"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input id="password" type="password" placeholder="••••••••"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- BUTTON LOGIN & REGISTER -->
    <div class="flex gap-2">
      <button onclick="login()"
        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
        Login
      </button>
      <button onclick="register()"
        class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition">
        Register
      </button>
    </div>

    <p id="pesan" class="text-red-500 text-sm text-center mt-4"></p>
  </div>

  <script>
    const { createClient } = supabase
    const sb = createClient(
      'https://bgtgeltkbanlnvymalum.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE'
    )

    async function register() {
      const email = document.getElementById('email').value
      const pass = document.getElementById('password').value
      const pesan = document.getElementById('pesan')

      if (!email || !pass) {
        pesan.textContent = 'Email dan password wajib diisi!'
        return
      }

      pesan.textContent = 'Memproses registrasi...'
      pesan.className = 'text-blue-500 text-sm text-center mt-4'

      const { data, error } = await sb.auth.signUp({
        email: email,
        password: pass
      })

      if (error) {
        pesan.textContent = 'Register gagal! ' + error.message
        pesan.className = 'text-red-500 text-sm text-center mt-4'
      } else {
        pesan.textContent = 'Register berhasil! Silakan login.'
        pesan.className = 'text-green-500 text-sm text-center mt-4'
        console.log(data)
      }
    }

    async function login() {
      const email = document.getElementById('email').value
      const pass = document.getElementById('password').value
      const pesan = document.getElementById('pesan')

      if (!email || !pass) {
        pesan.textContent = 'Email dan password wajib diisi!'
        return
      }

      pesan.textContent = 'Memproses login...'
      pesan.className = 'text-blue-500 text-sm text-center mt-4'

      const { data, error } = await sb.auth.signInWithPassword({
        email: email,
        password: pass
      })

      if (error) {
        pesan.textContent = 'Login gagal! ' + error.message
        pesan.className = 'text-red-500 text-sm text-center mt-4'
        return
      }

      // Redirect sesuai role (opsional)
      const { data: profile } = await sb
        .from('profiles')
        .select('role')
        .eq('id', data.user.id)
        .single()

      const role = profile.role
      if (role === 'manajer') location.href = 'manajer.html'
      else if (role === 'staf_pengadaan') location.href = 'staf-pengadaan.html'
      else if (role === 'staf_keuangan') location.href = 'staf-keuangan.html'
      else location.href = 'user.html'
    }
  </script>
</body>
</html>
