<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard User</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <nav class="bg-blue-700 text-white px-6 py-4 flex justify-between items-center shadow">
    <h1 class="font-bold text-lg">Dashboard User</h1>
    <button onclick="logout()" class="bg-white text-blue-700 px-4 py-1 rounded-lg text-sm font-semibold">Logout</button>
  </nav>

  <div class="max-w-3xl mx-auto mt-8 px-4">
    <div class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-700 mb-4">Ajukan Purchase Request</h2>
      <div class="mb-3">
        <label class="block text-sm font-medium text-gray-600 mb-1">Nama Barang</label>
        <input id="nama_barang" type="text" placeholder="contoh: Laptop Dell"
          class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <div class="mb-3">
        <label class="block text-sm font-medium text-gray-600 mb-1">Jumlah</label>
        <input id="jumlah" type="number" placeholder="contoh: 5"
          class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-600 mb-1">Spesifikasi</label>
        <textarea id="spesifikasi" placeholder="jelaskan spesifikasi barang..."
          class="w-full border rounded-lg px-3 py-2 h-24 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
      </div>
      <button onclick="ajukanPR()"
        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-semibold">
        Kirim Pengajuan
      </button>
      <p id="pesanPR" class="text-sm mt-2"></p>
    </div>

    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-bold text-gray-700 mb-4">Riwayat Pengajuan Saya</h2>
      <div id="listPR"><p class="text-gray-400 text-sm">Memuat data...</p></div>
    </div>
  </div>

  <script>
    const { createClient } = supabase
    const sb = createClient('https://bgtgeltkbanlnvymalum.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGdlbHRrYmFubG52eW1hbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MTAwNDksImV4cCI6MjA5NTA4NjA0OX0.-JlapeQpug44SjkEKgb1wyoX2_ftdGGcAnTHJhdzvwE')

    async function cekLogin() {
      const { data } = await sb.auth.getSession()
      if (!data.session) { window.location.href = 'index.html'; return }
      muatPR()
    }

    async function ajukanPR() {
      const { data: sessionData } = await sb.auth.getSession()
      const userId = sessionData.session.user.id
      const nama = document.getElementById('nama_barang').value
      const jumlah = document.getElementById('jumlah').value
      const spesifikasi = document.getElementById('spesifikasi').value
      const pesan = document.getElementById('pesanPR')

      if (!nama || !jumlah || !spesifikasi) {
        pesan.textContent = 'Semua kolom wajib diisi!'
        pesan.className = 'text-red-500 text-sm mt-2'
        return
      }

      const { error } = await sb.from('purchase_request').insert({
        user_id: userId, nama_barang: nama,
        jumlah: parseInt(jumlah), spesifikasi: spesifikasi, status: 'menunggu'
      })

      if (error) {
        pesan.textContent = 'Gagal mengirim! ' + error.message
        pesan.className = 'text-red-500 text-sm mt-2'
      } else {
        pesan.textContent = '✅ Pengajuan berhasil dikirim!'
        pesan.className = 'text-green-600 text-sm mt-2'
        document.getElementById('nama_barang').value = ''
        document.getElementById('jumlah').value = ''
        document.getElementById('spesifikasi').value = ''
        muatPR()
      }
    }

    async function muatPR() {
      const { data: sessionData } = await sb.auth.getSession()
      const userId = sessionData.session.user.id
      const { data } = await sb.from('purchase_request').select('*')
        .eq('user_id', userId).order('created_at', { ascending: false })

      const container = document.getElementById('listPR')
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-sm">Belum ada pengajuan.</p>'
        return
      }

      const warna = { menunggu: 'yellow', disetujui: 'green', ditolak: 'red' }
      container.innerHTML = data.map(pr => `
        <div class="border rounded-lg p-4 mb-3">
          <div class="flex justify-between items-start">
            <div>
              <p class="font-semibold text-gray-700">${pr.nama_barang}</p>
              <p class="text-sm text-gray-500">Jumlah: ${pr.jumlah}</p>
              <p class="text-sm text-gray-500">${pr.spesifikasi}</p>
            </div>
            <span class="text-xs font-bold px-3 py-1 rounded-full bg-${warna[pr.status]}-100 text-${warna[pr.status]}-700">
              ${pr.status.toUpperCase()}
            </span>
          </div>
        </div>
      `).join('')
    }

    async function logout() {
      await sb.auth.signOut()
      window.location.href = 'index.html'
    }

    cekLogin()
  </script>
</body>
</html>
